<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12142A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catorcenas">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Catorcenas Claras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Medianoche y durazno: índigo profundo en capas, durazno para lo que toca pagar, lila y cielo para fijos y extras,
   menta solo para lo que ya está listo. Una sola familia (Schibsted Grotesk) con cifras gruesas. Siempre oscuro. */
:root{
  --bg:#12142A;
  --surface:#1B1E3B;
  --surface-2:#252950;
  --surface-3:#2E335C;
  --line:#2E335C;
  --ink:#EEF0FF;
  --ink-soft:#B4B8E0;
  --ink-faint:#8A8FC0;
  --accent:#FFB38A;
  --accent-rgb:255,179,138;
  --accent-strong:#FFC9A8;
  --accent-soft:rgba(255,179,138,.14);
  --accent-dim:#3A4070;
  --lilac:#B8A6FF;
  --sky:#7CC4FF;
  --fixed:var(--lilac);
  --extra:var(--sky);
  --save:#F5A3C7;
  --ok:#7DDFB4;
  --ok-soft:rgba(125,223,180,.14);
  --warn:#FFD27A;
  --danger:#FF7A8A;
  --danger-soft:rgba(255,122,138,.15);
  --font-body:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:var(--font-body);
  --font-display:var(--font-body);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.4;-webkit-font-smoothing:antialiased;}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px;}
button,input,select{font-family:inherit;font-size:14px;color:var(--ink);}
button{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;transition:background-color .18s,border-color .18s,transform .15s var(--ease),color .18s;}
button:hover{border-color:var(--ink-faint);}
button:active{transform:scale(.96);}
button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.35);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{background:transparent;}
.btn-danger{color:var(--danger);}
input,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;transition:border-color .18s;}
input:hover{border-color:var(--ink-faint);}
input::placeholder{color:var(--ink-faint);}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.mono{font-weight:700;}

/* Encabezado y navegación */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(18,20,42,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:14px 12px;}
.appbar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.appbar h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-0.03em;}
.appbar h1 span{color:var(--accent);}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;}
.sync[data-s="ok"] i{background:var(--ok);}
.sync[data-s="off"] i{background:var(--danger);}
.sync[data-s="wait"] i{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.35}}
.tabs{display:none;}
.top-add{display:none;}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;max-width:536px;margin:0 auto;display:flex;align-items:center;padding:6px 8px;background:rgba(27,30,59,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px rgba(5,6,18,.5);}
.bnav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;border-radius:16px;color:var(--ink-faint);font-size:11.5px;font-weight:600;padding:7px 0;position:relative;}
.bnav .tab svg{width:22px;height:22px;transition:transform .3s var(--spring);}
.bnav .tab[aria-current="page"]{color:var(--accent-strong);}
.bnav .tab[aria-current="page"] svg{transform:translateY(-2px) scale(1.08);}
.bnav .tab[aria-current="page"]::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dotIn .35s var(--spring);}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
.fab{width:56px;height:56px;flex:none;margin:-28px 6px 0;border-radius:19px;border:none;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(var(--accent-rgb),.35);}
.fab svg{width:26px;height:26px;transition:transform .35s var(--spring);}
.fab:hover{background:var(--accent-strong);border-color:transparent;}
.fab:hover svg{transform:rotate(90deg);}
.fab:active{transform:scale(.92);}

.period,.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 14px;}
.period .lbl{font-size:14px;font-weight:600;color:var(--ink-soft);}
.shead .cap{font-size:13px;color:var(--ink-soft);}
.shead h2{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-0.03em;}
.nav{display:flex;gap:6px;flex:none;}
.nav button{width:38px;height:38px;padding:0;border-radius:12px;background:var(--surface);font-size:18px;color:var(--ink);}
.nav button.now{width:auto;padding:0 12px;font-size:13px;font-weight:600;}
.nav button:disabled{opacity:.35;cursor:default;}

/* Bloques */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;}
.hero .cap{font-size:13px;color:var(--ink-soft);}
.hero .big{font-size:46px;font-weight:800;line-height:1.02;letter-spacing:-0.035em;color:var(--ink);margin:6px 0 16px;}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:3px;background:var(--surface-2);}
.split span{display:block;height:100%;border-radius:5px;transition:width .8s var(--ease);}
.legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-soft);}
.legend b{font-weight:700;color:var(--ink);}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;}
.next{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
.next b{color:var(--ink);}

.add{width:100%;margin:12px 0 22px;padding:14px;font-size:15px;border-radius:16px;}
.section{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 10px;letter-spacing:-0.02em;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:22px;overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:13px 16px;}
.row:first-child{border-top:none;}
.row:hover{background:var(--surface-2);}
.row:active{transform:none;background:var(--surface-3);}
.row .grow{flex:1;min-width:0;}
.row .t{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .s{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.row .amt{font-weight:700;white-space:nowrap;}
.row .plus{color:var(--ok);}
.empty{padding:18px 16px;color:var(--ink-faint);font-size:13.5px;line-height:1.55;margin:0;}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft);margin-left:6px;vertical-align:1px;font-weight:500;}

.hist{padding:14px 16px 6px;}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
.hrow .d{color:var(--ink-soft);}
.hrow .d.cur{color:var(--accent-strong);font-weight:700;}
.hbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px;background:var(--surface-2);}
.hbar span{display:block;height:100%;border-radius:6px;transition:width .8s var(--ease);}
.hrow .v{font-weight:700;text-align:right;min-width:72px;}

.salary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;flex-wrap:wrap;}
.salary .v{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
.salary .s{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}

.sheet{background:var(--surface);border:1px solid rgba(var(--accent-rgb),.35);border-radius:22px;padding:18px;margin:12px 0 22px;animation:reveal .35s var(--ease);}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sheet-head b{font-size:17px;font-weight:800;letter-spacing:-0.02em;}
.amount-in{font-size:28px;font-weight:800;padding:12px 14px;letter-spacing:-0.02em;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px;}
.kinds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.kinds button{padding:8px 13px;border-radius:12px;font-size:13px;}
.kinds button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.actions .grow{flex:1;}
.err{color:var(--danger);font-size:13px;margin:10px 0 0;}
.note{font-size:12.5px;color:var(--ink-faint);line-height:1.55;margin:10px 0 0;}

.welcome{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:18px;}
.welcome h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.welcome p{margin:0 0 14px;color:var(--ink-soft);line-height:1.55;}

.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 10px;}
.ghead h2{margin:0;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;}
.ghead h2 span{color:var(--ink-faint);margin-left:8px;font-weight:600;font-size:14px;letter-spacing:0;}
.ghead button{padding:7px 13px;font-size:13px;font-weight:600;}

/* Deudas */
.dhead{margin:14px 0 6px;}
.dhead .cap{font-size:13px;color:var(--ink-soft);}
.dhead .big{font-size:48px;font-weight:800;letter-spacing:-0.04em;line-height:1.02;margin-top:2px;}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.chips span{padding:7px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
.chips b{color:var(--ink);font-weight:700;}
.wallet{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;}
.wallet::-webkit-scrollbar{display:none;}
.wcard{flex:none;width:262px;min-height:206px;scroll-snap-align:start;border-radius:24px;padding:16px;background:var(--wc,var(--surface-2));color:var(--wi,var(--ink));display:flex;flex-direction:column;gap:10px;border:1px solid transparent;transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
.wcard.neutral{border-color:var(--line);}
.wcard .wtop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.wcard .debt-name{color:inherit;font-size:17px;font-weight:800;}
.wcard .debt-name svg{stroke:currentColor;opacity:.6;}
.wcard .wday{font-size:12px;opacity:.75;white-space:nowrap;}
.wcard .wlbl{font-size:12px;opacity:.75;}
.wcard .wbal{font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;}
.wcard .wmeta{font-size:12px;opacity:.85;line-height:1.45;}
.wcard .wmeta b{font-weight:700;}
.wcard .wbar{height:6px;border-radius:3px;background:rgba(18,20,42,.18);overflow:hidden;}
.wcard.neutral .wbar{background:var(--surface-3);}
.wcard .wbar span{display:block;height:100%;border-radius:3px;background:var(--wi,var(--ok));transition:width .8s var(--ease);}
.wcard.neutral .wbar span{background:var(--ok);}
.wcard .wbtns{display:flex;gap:8px;margin-top:auto;}
.wcard .wbtns button{flex:1;padding:9px 8px;font-size:13px;font-weight:700;border-radius:12px;background:rgba(18,20,42,.14);border-color:rgba(18,20,42,.18);color:inherit;}
.wcard .wbtns button:hover{background:rgba(18,20,42,.24);}
.wcard:not(.neutral) .wbtns button[data-act="pay"]{background:var(--wi);border-color:var(--wi);color:var(--wc);}
.wcard:not(.neutral) .wbtns button[data-act="fix"]{background:transparent;border-color:rgba(18,20,42,.35);}
.wcard.neutral .wbtns button[data-act="pay"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.wcard.neutral .wbtns button[data-act="fix"]{background:var(--surface-3);border-color:var(--line);}
.wadd{flex:none;width:150px;min-height:206px;scroll-snap-align:start;border-radius:24px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.wadd svg{width:26px;height:26px;}
.loans{display:grid;gap:12px;}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s;}
.lcard .ltop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.lcard .debt-name{font-size:16px;font-weight:800;}
.lcard .lsub{font-size:12.5px;color:var(--ink-faint);margin-top:3px;line-height:1.45;}
.lcard .lsub b{color:var(--ink-soft);font-weight:700;}
.lcard .lbal{font-size:22px;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;}
.lcard .lbar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.lcard .wbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.lcard .wbar span{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .8s var(--ease);}
.lcard .wbtns{display:flex;gap:8px;}
.lcard .wbtns button{flex:1;padding:10px 8px;font-size:13px;font-weight:700;border-radius:12px;}
.lcard .wbtns button[data-act="pay"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.debt-name{background:none;border:none;padding:0;text-align:left;font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.debt-name:hover{border-color:transparent;opacity:.85;}
.debt-name svg{width:13px;height:13px;stroke:var(--ink-faint);}
.extra-line{font-size:12px;margin-top:2px;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);}
.wcard .badge{background:rgba(18,20,42,.18);color:inherit;}
.pill-warn{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,210,122,.15);color:var(--warn);}

/* Modales */
.modal-back{position:fixed;inset:0;background:rgba(8,9,22,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fade .2s ease;}
@media (min-width:600px){.modal-back{align-items:center;}}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;animation:up .38s var(--spring);max-height:calc(100% - 20px);overflow:auto;}
.modal h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.modal .sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.modal .field{margin-top:12px;}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;color:var(--ink-soft);}
.chk input{width:20px;height:20px;accent-color:var(--accent);}
.live{margin-top:10px;font-size:13px;color:var(--ink-soft);}
.live b{font-weight:700;color:var(--accent-strong);}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2);padding:3px;gap:3px;}
.seg button{flex:1;border:none;border-radius:11px;padding:9px 6px;font-size:13px;background:transparent;color:var(--ink-soft);font-weight:600;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700;}
.seg button:active{transform:none;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.optional{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);}
.optional .hint{font-size:12px;color:var(--ink-faint);margin:4px 0 0;}
.segwrap{flex-wrap:wrap;}
.segwrap button{flex:1 1 40%;}
.only-wide{display:none;}

/* Avance de deudas */
.trend{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px 12px;margin:16px 0 8px;}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.trend-head h2{margin:0;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;}
.trend-sub{font-size:13px;color:var(--ink-soft);}
.trend-sub b{font-weight:700;color:var(--ok);}
.trend-plot{position:relative;margin-top:8px;}
.trend-plot svg{display:block;width:100%;overflow:visible;}
.trend-plot text{font-size:10.5px;fill:var(--ink-faint);}
.trend-plot .gl{stroke:var(--line);stroke-width:1;}
.trend-plot .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.trend-plot .ar{fill:url(#trendFill);}
.trend-plot .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2;}
.trend-plot .end text{fill:var(--ink);font-size:12px;font-weight:700;}
.trend-plot .xh{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:3 3;}
.trend-empty{margin:10px 0 6px;font-size:13.5px;color:var(--ink-faint);line-height:1.55;}
.trend-empty b{color:var(--ink);}
.trend-tip{position:absolute;top:0;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12px;color:var(--ink-soft);white-space:nowrap;box-shadow:0 10px 24px rgba(5,6,18,.45);z-index:3;}
.trend-tip b{display:block;font-weight:800;color:var(--ink);font-size:14px;}
.trend-tip .ab{color:var(--ok);}
.trend details{margin-top:6px;font-size:12.5px;color:var(--ink-faint);}
.trend summary{cursor:pointer;padding:4px 0;width:max-content;}
.trend table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;}
.trend td,.trend th{padding:6px 4px;border-top:1px solid var(--line);text-align:right;font-weight:500;color:var(--ink-soft);}
.trend th{color:var(--ink-faint);border-top:none;}
.trend td:first-child,.trend th:first-child{text-align:left;}

/* Gastos */
.glayout{margin-top:14px;}
.gform{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin:0 0 22px;}
.gform .add{margin:16px 0 0;}
.flabel{display:block;font-size:12.5px;color:var(--ink-soft);margin:14px 0 7px;}
.kinds.tight{margin-top:0;}
.kinds .newcat{border-style:dashed;color:var(--accent-strong);background:transparent;}
.gsum{margin-bottom:6px;}
.gview{margin-bottom:14px;}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.gnav .lbl{font-weight:700;font-size:15px;text-align:center;flex:1;min-width:0;}
.gnav button{width:36px;height:36px;padding:0;border-radius:12px;background:var(--surface-2);}
.gnav-r{display:flex;gap:6px;}
.gnav-r #gNow{width:auto;padding:0 12px;font-size:13px;font-weight:600;}
.gmeth{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-soft);}
.gmeth b{font-weight:700;color:var(--ink);}
.cats{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;width:100%;background:transparent;border:1px solid transparent;border-radius:14px;padding:9px 10px;text-align:left;align-items:baseline;}
.crow:hover{background:var(--surface-2);border-color:transparent;}
.crow:active{transform:none;}
.crow[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(var(--accent-rgb),.4);}
.crow .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crow .v{font-size:14px;font-weight:700;white-space:nowrap;}
.crow .v small{color:var(--ink-faint);margin-left:8px;font-size:12px;display:inline-block;min-width:32px;text-align:right;font-weight:500;}
.crow .meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.crow .meter span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .8s var(--ease);}
.mycats{display:flex;flex-wrap:wrap;gap:6px;}
.mycat{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;}
.mycat button{padding:3px 10px;border-radius:99px;font-size:11.5px;color:var(--danger);background:transparent;}

/* Separar */
.donutcard{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;}
.donutrow{display:flex;gap:16px;align-items:center;}
.donut{position:relative;width:148px;height:148px;flex:none;}
.donut svg{display:block;transform:rotate(-90deg);}
.donut circle{fill:none;stroke-width:16;}
.donut .seg-arc{transition:stroke-dasharray .95s var(--ease),stroke-dashoffset .95s var(--ease);}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.donut .mid b{font-size:25px;font-weight:800;letter-spacing:-0.035em;}
.donut .mid span{font-size:11.5px;color:var(--ink-soft);}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px;}
.dleg div{display:flex;justify-content:space-between;gap:8px;color:var(--ink-soft);}
.dleg b{color:var(--ink);font-weight:700;}
.dleg .free{border-top:1px solid var(--line);padding-top:9px;}
.dleg .free b{color:var(--ok);}
.dleg .free b.neg{color:var(--danger);}
.dleg .ring{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface-3);margin-right:7px;vertical-align:-1px;}
.sprog{margin-top:16px;}
.sprog .l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:7px;}
.sprog .l b{color:var(--ok);font-weight:700;}
.sprog .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.sprog .bar span{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .8s var(--ease);}
.salert{margin-top:12px;font-size:13px;color:var(--danger);}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden;}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;background:transparent;border:none;border-radius:0;text-align:left;}
.acc-head:hover{background:var(--surface-2);}
.acc-head:active{transform:none;}
.acc-head .dot{width:11px;height:11px;border-radius:50%;flex:none;}
.acc-head .tt{flex:1;min-width:0;}
.acc-head .tt b{font-weight:800;font-size:15.5px;}
.acc-head .tt span{color:var(--ink-faint);margin-left:8px;font-size:13px;}
.acc-head .tot{font-weight:800;}
.acc-head svg{width:16px;height:16px;stroke:var(--ink-faint);transition:transform .35s var(--ease);flex:none;}
.acc.open .acc-head svg{transform:rotate(180deg);}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease);}
.acc.open .acc-body{grid-template-rows:1fr;}
.acc-in{overflow:hidden;min-height:0;}
.acc-in .inner{padding:2px 8px 8px;}
.sitem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:16px;transition:background-color .3s;}
.sitem.done{background:rgba(125,223,180,.07);}
.sbody{flex:1;min-width:0;background:transparent;border:none;border-radius:0;padding:0;text-align:left;}
.sbody:hover{border-color:transparent;}
.sbody:hover .t{color:var(--accent-strong);}
.sbody:active{transform:none;}
.sbody:disabled{cursor:default;}
.sbody:disabled:hover .t{color:var(--ink);}
.sbody .t{display:block;font-weight:700;transition:color .2s;}
.sbody .s{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px;line-height:1.45;}
.sbody .note2{color:var(--accent-strong);}
.samt{font-weight:800;white-space:nowrap;font-size:15px;transition:color .3s;}
.sitem.done .t{color:var(--ok);}
.sitem.done .samt{color:var(--ok);}
.scheck{position:relative;flex:none;width:28px;height:28px;margin:0;cursor:pointer;}
.scheck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;}
.scheck span{position:absolute;inset:0;pointer-events:none;border:2px solid var(--surface-3);border-radius:9px;transition:background-color .2s,border-color .2s;}
.scheck:hover span{border-color:var(--ink-faint);}
.scheck input:checked+span{background:var(--ok);border-color:var(--ok);}
.scheck input:checked+span::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg);}
.scheck input:focus-visible+span{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.35);}
.scheck.pop span{animation:pop .45s var(--spring);}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.cols{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:22px;}
.cols-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cols-h b{font-weight:800;font-size:15.5px;}
.cols-h span{font-size:12px;color:var(--ink-faint);}
.cols-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px;align-items:end;height:150px;}
.colb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;padding:6px 2px;border:none;border-radius:12px;background:transparent;}
.colb:hover{background:var(--surface-2);}
.colb:active{transform:none;}
.colb.sel{background:var(--surface-2);}
.colb .cv{font-size:10.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.colb .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:9px 9px 4px 4px;overflow:hidden;}
.colb .stack span{display:block;width:100%;transition:height .8s var(--ease);}
.colb .cd{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.colb.sel .cd{color:var(--accent-strong);font-weight:700;}
.cols-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-soft);}

/* Pagado */
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;}
.sinfo .sbody{width:100%;}
.sacts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.paybtn{padding:6px 12px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--accent-soft);border-color:rgba(var(--accent-rgb),.4);color:var(--accent-strong);}
.paybtn:hover{background:rgba(var(--accent-rgb),.24);border-color:var(--accent);}
.paid{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--ok-soft);border-color:rgba(125,223,180,.35);color:var(--ok);animation:paidIn .45s var(--spring);}
.paid svg{width:13px;height:13px;}
@keyframes paidIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.linkbtn{background:none;border:none;padding:4px 0;font-size:12.5px;color:var(--ink-faint);text-decoration:underline;text-underline-offset:3px;}
.linkbtn:hover{color:var(--ink-soft);}
.sitem.isPaid .samt{color:var(--ink-faint);}
.sitem.pend{padding-left:12px;}
.sbody .s.late{color:var(--warn);}
.pendacc{border-color:rgba(255,210,122,.35);}
.scheck input:disabled{cursor:default;}
.scheck input:disabled+span{opacity:.35;}

/* Selector de fecha */
.datebtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;font-weight:500;}
.datebtn:hover{border-color:var(--ink-faint);}
.datebtn:active{transform:none;}
.datebtn svg{width:18px;height:18px;flex:none;color:var(--ink-faint);}
.dpop{position:fixed;z-index:60;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 18px 40px rgba(5,6,18,.6);animation:dpIn .28s var(--spring);transform-origin:top center;}
@keyframes dpIn{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dp-h b{font-weight:800;font-size:15px;text-transform:capitalize;}
.dp-h button{width:34px;height:34px;padding:0;border-radius:10px;background:var(--surface-2);font-size:17px;}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
.dp-w span{font-size:11px;color:var(--ink-faint);text-align:center;padding:4px 0;font-weight:600;}
.dp-g button{height:36px;padding:0;border-radius:10px;border:1px solid transparent;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink);}
.dp-g button:hover{background:var(--surface-2);border-color:transparent;}
.dp-g button.today{border-color:var(--ink-faint);}
.dp-g button.sel{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:800;}
.dp-f{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.dp-f button{padding:7px 12px;font-size:12.5px;font-weight:700;border-radius:10px;}
.dp-f .dp-x{margin-left:auto;background:transparent;}

/* Tarjetas: cara y detalle */
.wcard{cursor:pointer;min-height:196px;}
.wcard:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.5);}
.wcard:active{transform:scale(.985);}
.wcard .wname{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.wcard .wmid{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.wcard .wbtns{align-items:center;}
.wcard .wbtns button{flex:0 0 auto;padding:9px 18px;}
.wcard .whint{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;opacity:.75;}
.wcard .whint svg{width:15px;height:15px;}
.wring{position:relative;width:52px;height:52px;flex:none;}
.wring svg{display:block;width:100%;height:100%;transform:rotate(-90deg);}
.wring circle{fill:none;stroke-width:6;stroke-linecap:round;}
.wring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;}
.wcard.loan .wbtns button[data-act="pay"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.dd-head{margin:-20px -20px 16px;padding:20px;border-radius:26px 26px 18px 18px;background:var(--wc,var(--surface-2));color:var(--wi,var(--ink));}
.dd-head .dd-k{font-size:12px;font-weight:700;opacity:.75;}
.dd-head h3{margin:2px 0 8px;font-size:22px;}
.dd-head .dd-bal{font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;}
.dd-head .dd-sub{font-size:12.5px;opacity:.75;margin-top:2px;}
.dd-prog .l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:7px;}
.dd-prog .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.dd-prog .bar span{display:block;height:100%;background:var(--ok);border-radius:4px;}
.dd-rows{margin:16px 0 0;display:grid;gap:0;}
.dd-rows div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;}
.dd-rows dt{color:var(--ink-faint);}
.dd-rows dd{margin:0;color:var(--ink);}
.dd-rows dd b{font-weight:700;}
.dd-pays{margin-top:14px;}
.dd-pays-h{font-size:13px;font-weight:800;margin-bottom:6px;}
.dd-pay{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);}
.dd-pay b{color:var(--ink);font-weight:700;}
.dd-pay em{font-style:normal;font-size:11.5px;color:var(--ink-faint);}
.dd-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}

/* Gastos fijos en Gastos */
.fxacc{margin-top:-6px;}
@media (min-width:900px){ .glayout .col-a{position:static;} }
.fxacc .inner{padding:0 8px 10px;}
.fxrow{border-radius:14px;border-top:none;padding:11px 10px;}
.fxrow + .fxrow{border-top:1px solid var(--line);border-radius:0;}
.fxadd{width:100%;margin-top:6px;border:1.5px dashed var(--line);background:transparent;color:var(--accent-strong);font-weight:700;border-radius:14px;padding:11px;}
.fxadd:hover{border-color:var(--accent);background:var(--accent-soft);}

/* Bola de nieve */
.snow{background:linear-gradient(180deg,rgba(124,196,255,.10),rgba(124,196,255,.03));border:1px solid rgba(124,196,255,.35);border-radius:24px;padding:18px;margin:16px 0 4px;}
.sn-h{display:flex;gap:12px;align-items:flex-start;}
.sn-h b{font-size:16px;font-weight:800;}
.sn-h p{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.sn-h p b{font-size:inherit;color:var(--ink);}
.sn-ic{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(124,196,255,.18);color:var(--sky);display:flex;align-items:center;justify-content:center;}
.sn-ic svg{width:20px;height:20px;}
.sn-q{margin:14px 0 8px;font-size:13px;font-weight:700;}
.sn-opts{display:grid;gap:8px;}
.sn-opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;margin:0;transition:border-color .2s,background-color .2s;}
.sn-opt.on{border-color:var(--sky);background:rgba(124,196,255,.08);}
.sn-opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--sky);flex:none;}
.sn-o{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink);}
.sn-o .s{font-size:12.5px;color:var(--ink-faint);}
.sn-row{margin-top:12px;max-width:260px;}
@media (min-width:900px){ .sn-opts{grid-template-columns:repeat(3,minmax(0,1fr));} }

/* Entradas animadas: un solo momento al cambiar de pestaña o de periodo */
.enter .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms);}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media (min-width:900px){
  .app{max-width:1140px;padding-inline:32px;padding-bottom:48px;}
  .appbar{padding-block:18px 14px;}
  .appbar h1{font-size:22px;}
  .appbar-row{gap:20px;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-left:auto;}
  .tabs .tab{border:none;background:transparent;border-radius:12px;padding:8px 16px;color:var(--ink-soft);font-weight:600;font-size:14px;}
  .tabs .tab:hover{color:var(--ink);background:var(--surface-2);}
  .tabs .tab[aria-current="page"]{background:var(--surface-3);color:var(--accent-strong);}
  .top-add{display:inline-flex;align-items:center;gap:8px;}
  .top-add svg{width:18px;height:18px;}
  .bnav{display:none;}
  .layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;align-items:start;}
  .col-a{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));}
  .only-wide{display:block;}
  .only-narrow{display:none;}
  .hero .big{font-size:58px;}
  .shead h2{font-size:32px;}
  .card .row{padding:14px 20px;}
  .dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  .dhead .big{font-size:64px;}
  .wallet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));overflow:visible;margin:0;padding:0;}
  .wcard,.wadd{width:auto;}
  .wcard:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(5,6,18,.45);}
  .loans{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
  .modal{padding:24px;}
  .donut{width:170px;height:170px;}
}
@media (min-width:1280px){ .app{max-width:1240px;} }
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:13px 16px;border-radius:16px;font-weight:700;font-size:13.5px;z-index:50;background:var(--ok);color:var(--bg);animation:toastIn .45s var(--spring);box-shadow:0 12px 28px rgba(5,6,18,.45);}
@media (min-width:900px){ .toast{bottom:24px;} }
.toast.bad{background:var(--danger);}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.fade-in{animation:reveal .35s var(--ease);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
.goal{padding:16px 18px;}
.gl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.gl-top b{font-size:15px;}
.gl-top span{font-size:13px;color:var(--ink-faint);}
.gl-bal{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px;color:var(--save);}
.gl-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.gl-bar span{display:block;height:100%;width:0;border-radius:99px;background:var(--save);transition:width .9s var(--ease);}
.gl-sub{font-size:13px;color:var(--ink-soft);margin-top:8px;}
.gl-sub .ok{color:var(--ok);}
.gl-lines{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:13px;color:var(--ink-soft);}
.gl-lines b{color:var(--ink);}
.gl-lines .linkbtn{margin-left:4px;}
.gl-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;}
.gl-btns button:not(.linkbtn):not(.btn-primary){background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;}
.gl-btns .linkbtn{margin-left:auto;}
.sn-o .badge{width:fit-content;}
.snow .badge.sb{background:rgba(124,196,255,.14);color:var(--sky);}
.snow .sn-h{width:100%;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;align-items:flex-start;}
.snow .sn-h>div{flex:1;min-width:0;}
.sn-chev{width:20px;height:20px;flex:none;color:var(--ink-faint);margin-top:2px;transition:transform .3s var(--ease);}
.snow.open .sn-chev{transform:rotate(180deg);}
.sn-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease);}
.snow.open .sn-body{grid-template-rows:1fr;}
.sn-in{overflow:hidden;min-height:0;}
.snow:not(.open) .sn-h p{margin-bottom:0;}
.confirm-back{z-index:70;}
.modal.confirm{max-width:400px;}
.cf-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,122,138,.14);color:var(--danger);margin-bottom:12px;}
.cf-ic svg{width:22px;height:22px;}
.cf-detail{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-soft);margin-top:12px;}
.cf-detail b{color:var(--ink);}
.cf-warn{font-size:12.5px;color:var(--danger);margin:12px 0 0;}
.mclose{position:sticky;top:0;float:right;z-index:2;width:32px;height:32px;margin:-2px -4px 8px 12px;padding:0;border-radius:50%;border:0;background:rgba(238,240,255,.07);color:var(--ink-faint);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .15s;}
.mclose:hover{background:rgba(255,179,138,.16);color:var(--accent-strong);}
.mclose:active{transform:scale(.92);}
.mclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.mclose svg{width:16px;height:16px;}
.ggrp{padding:3px;}
.ggrp button{padding:6px 12px;font-size:13px;}
.gacc{scroll-margin-top:90px;}
.gacc .acc-head .tt span{display:inline-block;}
.gacc.flash{animation:gflash 1.2s var(--ease);}
@keyframes gflash{0%,100%{border-color:var(--line);}25%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,179,138,.18);}}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 6px 8px;font-size:13.5px;color:var(--ink-soft);font-weight:600;}
.dayh:first-child{margin-top:0;}
.dayh b{color:var(--ink);font-weight:700;}
.gday{margin-bottom:4px;}
@media (prefers-reduced-motion: reduce){.gacc.flash{animation:none;}}
.inbox{background:linear-gradient(160deg,rgba(255,179,138,.14),rgba(255,179,138,.04));border:1px solid rgba(255,179,138,.35);border-radius:22px;padding:14px 14px 6px;margin-bottom:16px;}
.ib-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 8px;}
.ib-h b{font-size:15.5px;font-weight:800;}
.ib-h span{font-size:12.5px;color:var(--ink-soft);}
.ib-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid rgba(255,179,138,.18);}
.ib-row .grow{flex:1;min-width:0;}
.ib-row .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ib-row .s{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.ib-ok{padding:8px 14px;font-size:13.5px;}
.ib-x{background:none;border:0;color:var(--ink-faint);font:inherit;font-size:13px;padding:8px 6px;cursor:pointer;}
.ib-x:hover{color:var(--danger);}
.mvrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;}
.mvnote{color:var(--sky);}
.mvrow .linkbtn{font-size:12.5px;}
.mvbtn{color:var(--ink-soft);}
.sync{background:none;border:0;padding:6px 8px;margin:-6px -8px;border-radius:10px;cursor:pointer;font:inherit;font-size:11.5px;}
.sync:hover{background:var(--surface-2);}
.acct-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-top:12px;}
.acct-row .who{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;}
.acct-row .who small{display:block;color:var(--ink-faint);font-size:12px;}
.acct-btns{display:grid;gap:8px;margin-top:14px;}
.acct-btns button{width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;}
.acct-btns button small{display:block;font-weight:400;color:var(--ink-faint);font-size:12.5px;margin-top:2px;}
.acct-btns button:hover{background:var(--surface-3);}
.login{max-width:420px;margin:8vh auto 0;text-align:center;}
.login .logo{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;display:block;}
.login h2{font-size:26px;margin:0 0 8px;}
.login p{color:var(--ink-soft);margin:0 0 22px;}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:16px;border:0;background:#fff;color:#1f1f1f;font:inherit;font-weight:700;font-size:15px;cursor:pointer;}
.gbtn svg{width:20px;height:20px;}
.login .err{margin-top:14px;}
.importlink{margin-top:14px;font-size:13.5px;color:var(--ink-soft);}
body.nologin .bnav, body.nologin #fabTop, body.nologin .tabs{display:none !important;}
</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <div class="appbar-row">
      <h1>Catorcenas Claras</h1>
      <nav class="tabs" aria-label="Secciones">
        <button class="tab" type="button" data-tab="ingresos">Ingresos</button>
        <button class="tab" type="button" data-tab="gastos">Gastos</button>
        <button class="tab" type="button" data-tab="deudas">Deudas</button>
        <button class="tab" type="button" data-tab="separar">Separar</button>
      </nav>
      <button type="button" class="btn-primary top-add" id="fabTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Registrar gasto</button>
      <button type="button" class="sync" id="sync" data-s="wait" aria-label="Tu cuenta y respaldos"><i></i><span id="syncTxt">Conectando…</span></button>
    </div>
  </header>

  <main id="main">
    <div class="welcome" id="loading"><p style="margin:0">Cargando tus datos…</p></div>
  </main>

  <nav class="bnav" aria-label="Secciones">
    <button class="tab" type="button" data-tab="ingresos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Ingresos</button>
    <button class="tab" type="button" data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5"/><path d="M4 5h16"/></svg>Gastos</button>
    <button class="fab" type="button" id="fab" aria-label="Registrar gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" type="button" data-tab="deudas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg>Deudas</button>
    <button class="tab" type="button" data-tab="separar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11H4z"/><path d="M4 8l8 6 8-6"/></svg>Separar</button>
  </nav>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---------- Utilidades ---------- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const KINDS=['Venta','Trabajo extra','Bono o aguinaldo','Reembolso','Regalo','Otro'];
const fmtMoney=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const fmtMoney2=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>fmtMoney.format(Math.round(Number(n)||0));
const money2=n=>fmtMoney2.format(Number(n)||0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDate(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function days(a,b){ return Math.round((b-a)/86400000); }
const fmt=d=>d.getDate()+' '+MES[d.getMonth()];
const fmtLong=d=>DIA[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()];
function parseAmt(raw){
  let t=String(raw||'').trim().replace(/[$\s]/g,''); if(!t) return NaN;
  if(t.includes(',') && !t.includes('.') && /,\d{1,2}$/.test(t)) t=t.replace(',','.');
  return Number(t.replace(/,/g,''));
}

/* ---------- Estado ---------- */
let db=null;
const S={ anchor:null, salaries:{}, extras:{}, debts:{}, pays:{}, exps:{}, cats:{}, sep:{}, fixed:{}, goals:{}, gmoves:{}, inbox:{}, cardmap:{}, loaded:{goals:false,gmoves:false,config:false,salaries:false,extras:false,debts:false,pays:false,exps:false,cats:false,sep:false,fixed:false} };
let offset=0, sheet=null, editing=null, kind='Trabajo extra';
let tab='ingresos'; try{ const t=localStorage.getItem('cc2-tab'); if(['ingresos','gastos','deudas','separar'].includes(t)) tab=t; }catch(e){}

function periodOf(d){ return Math.floor(days(parseDate(S.anchor), d)/14); }
function periodStart(k){ return addDays(parseDate(S.anchor), 14*k); }
function periodLabel(k){ const s=periodStart(k); return fmt(s)+' – '+fmt(addDays(s,13)); }
function salaryFor(k){
  const start=iso(periodStart(k));
  const list=Object.values(S.salaries).filter(x=>x.from<=start).sort((a,b)=>b.from.localeCompare(a.from));
  return list.length ? Number(list[0].amount)||0 : 0;
}
function currentSalary(){
  const list=Object.entries(S.salaries).sort((a,b)=>b[1].from.localeCompare(a[1].from));
  const k=periodOf(today()); const start=iso(periodStart(k));
  const active=list.find(([,x])=>x.from<=start);
  const upcoming=list.filter(([,x])=>x.from>start).sort((a,b)=>a[1].from.localeCompare(b[1].from))[0];
  return { active: active?active[1]:null, upcoming: upcoming?upcoming[1]:null };
}
function extrasIn(k){ return Object.entries(S.extras).filter(([,e])=>e.date && periodOf(parseDate(e.date))===k).sort((a,b)=>b[1].date.localeCompare(a[1].date)||(b[1].ts||0)-(a[1].ts||0)); }
const sum=arr=>arr.reduce((s,[,e])=>s+(Number(e.amount)||0),0);

/* ---------- Avisos ---------- */
let toastT=null;
function toast(msg,bad){
  let t=document.querySelector('.toast'); if(t) t.remove();
  t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.setAttribute('role',bad?'alert':'status'); t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), bad?7000:3200);
}
function saved(p){
  return Promise.race([Promise.resolve(p).then(()=>true,()=>false), new Promise(r=>setTimeout(()=>r(false),10000))])
    .then(ok=>{ if(!ok) toast('No se guardó. Revisa tu conexión e intenta de nuevo.',true); return ok; });
}
function setSync(s){ const el=document.getElementById('sync'); el.dataset.s=s; document.getElementById('syncTxt').textContent= s==='ok'?'Guardado en la nube': s==='off'?'Sin conexión':'Conectando…'; }

/* ---------- Números que cuentan ---------- */
const numMem={};
function countTo(el,key,to,f){
  f=f||money;
  const from = key in numMem ? numMem[key] : 0; numMem[key]=to;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm || from===to){ el.textContent=f(to); return; }
  const t0=performance.now(), D=650;
  const step=now=>{ if(!el.isConnected) return; const p=Math.min(1,(now-t0)/D), e=1-Math.pow(1-p,3); el.textContent=f(p<1 ? from+(to-from)*e : to); if(p<1) requestAnimationFrame(step); };
  el.textContent=f(from); requestAnimationFrame(step);
}
/* Animación de entrada: un solo momento al abrir la app, cambiar de pestaña o de periodo.
   Las actualizaciones de datos que llegan después no vuelven a animar todo. */
let animNext=true, animStart=-1e9;
function staggerIn(root, elapsed){
  const out=[]; const walk=el=>{ [...el.children].forEach(c=>{ if(c.matches('.layout,.col-a,.col-b')) walk(c); else out.push(c); }); };
  walk(root);
  root.querySelectorAll('.card > .row, .inner > .sitem, .wallet > .debt, .loans > .debt').forEach(r=>out.push(r));
  out.forEach((el,i)=>{ el.classList.add('rise'); el.style.setProperty('--i', Math.min(i,18)); if(elapsed) el.style.animationDelay='calc(var(--i) * 50ms - '+Math.round(elapsed)+'ms)'; });
}
function growBars(root){
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim=animNext && !calm; animNext=false;
  const now=performance.now();
  if(anim){ animStart=now; root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter'); staggerIn(root,0); clearTimeout(growBars.t); growBars.t=setTimeout(()=>root.classList.remove('enter'),1800); }
  else if(!calm && now-animStart<1300){ staggerIn(root, now-animStart); }
  const set=(sel,prop,key,zero)=> root.querySelectorAll(sel).forEach(el=>{ if(anim){ el.style[prop]=zero; requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style[prop]=el.dataset[key]; })); } else el.style[prop]=el.dataset[key]; });
  set('[data-w]','width','w','0%'); set('[data-h]','height','h','0px');
  return anim;
}

/* ---------- Pantallas ---------- */
const main=()=>document.getElementById('main');
function ready(){ return S.loaded.config && S.loaded.salaries && S.loaded.extras; }

function render(){
  document.querySelectorAll('.tab').forEach(b=> b.setAttribute('aria-current', b.dataset.tab===tab ? 'page' : 'false'));
  if(tab==='deudas'){ renderDeudas(); return; }
  if(tab==='gastos'){ renderGastos(); return; }
  if(tab==='separar'){ renderSeparar(); return; }
  renderIngresos();
}
function renderIngresos(){
  if(!(S.loaded.config && S.loaded.salaries && S.loaded.extras)) return;
  if(!S.anchor || !Object.keys(S.salaries).length){ renderWelcome(); return; }
  const m=main(); if(m.contains(document.activeElement) && document.activeElement.tagName==='INPUT') return;
  const k=periodOf(today())+offset;
  const sal=salaryFor(k), ex=extrasIn(k), exTot=sum(ex), total=sal+exTot;
  const isNow=offset===0;
  const next=periodStart(periodOf(today())+1), dn=days(today(),next);
  const {active,upcoming}=currentSalary();
  const pctSal = total>0 ? sal/total*100 : 0;

  // historial (6 catorcenas)
  const kNow=periodOf(today());
  const firstK=Math.min(...Object.values(S.salaries).map(x=>periodOf(parseDate(x.from))), ...Object.values(S.extras).map(e=>periodOf(parseDate(e.date))));
  const rows=[]; for(let i=5;i>=0;i--){ const kk=kNow-i; if(kk<firstK) continue; const s=salaryFor(kk), e=sum(extrasIn(kk)); rows.push({kk,s,e,t:s+e}); }
  const maxT=Math.max(1,...rows.map(r=>r.t));

  const salaryCard='<h2 class="section">Tu sueldo</h2>'+
    '<div class="card">'+(sheet==='salary'?'<p class="empty">Editando tu sueldo…</p>':'<div class="salary"><div><div class="v">'+money(active?active.amount:0)+'</div><div class="s">por catorcena'+(active?' · desde el '+fmt(parseDate(active.from)):'')+'</div>'+
      (upcoming?'<div class="s" style="color:var(--accent-strong)">Cambia a '+money(upcoming.amount)+' desde el '+fmt(parseDate(upcoming.from))+'</div>':'')+
      '</div><button type="button" id="salBtn">Cambiar sueldo</button></div>')+'</div>';
  m.innerHTML=
    '<div class="period"><span class="lbl">'+(isNow?'Catorcena actual':offset<0?'Catorcena pasada':'Catorcena futura')+' · '+periodLabel(k)+'</span>'+
      '<span class="nav"><button type="button" id="prev" aria-label="Catorcena anterior">‹</button>'+(isNow?'':'<button type="button" class="now" id="now">Hoy</button>')+'<button type="button" id="nextP" aria-label="Siguiente catorcena">›</button></span></div>'+
    '<div class="layout"><div class="col-a">'+
    '<section class="hero" aria-label="Ingreso de la catorcena">'+
      '<div class="cap">Ingreso de esta catorcena</div>'+
      '<div class="big" id="bigTotal">'+money(total)+'</div>'+
      '<div class="split" aria-hidden="true"><span data-w="'+pctSal+'%" style="background:var(--lilac)"></span><span data-w="'+(100-pctSal)+'%" style="background:var(--accent)"></span></div>'+
      '<div class="legend"><span><i class="sw" style="background:var(--lilac)"></i>Sueldo <b>'+money(sal)+'</b></span><span><i class="sw" style="background:var(--accent)"></i>Extras <b>'+money(exTot)+'</b></span></div>'+
      (isNow?'<div class="next">Próximo pago: <b>'+fmtLong(next)+'</b> · '+(dn===1?'mañana':'en '+dn+' días')+'</div>':'')+
    '</section>'+
    (sheet? sheetHtml() : '<button type="button" class="btn-primary add" id="addBtn">+ Agregar ingreso extra</button>')+
    '<div class="only-wide">'+salaryCard+goalCardHtml()+'</div>'+
    '</div><div class="col-b">'+
    '<h2 class="section">Ingresos extra · '+periodLabel(k)+'</h2>'+
    '<div class="card" id="exList">'+(ex.length? ex.map(([id,e])=>
      '<button type="button" class="row" data-id="'+id+'"><span class="grow"><span class="t">'+esc(e.concept||e.kind||'Ingreso extra')+(e.kind&&e.concept?'<span class="pill">'+esc(e.kind)+'</span>':'')+'</span><span class="s">'+fmtLong(parseDate(e.date))+'</span></span><span class="amt plus">+'+money2(e.amount)+'</span></button>').join('')
      : '<p class="empty">'+(isNow?'Sin ingresos extra en esta catorcena. Si te llega dinero aparte de tu sueldo (una venta, un trabajo, un bono), agrégalo arriba.':'Sin ingresos extra en esta catorcena.')+'</p>')+'</div>'+
    '<h2 class="section">Últimas 6 catorcenas</h2>'+
    '<div class="card"><div class="hist">'+rows.map(r=>
      '<div class="hrow"><span class="d'+(r.kk===kNow?' cur':'')+'">'+fmt(periodStart(r.kk))+'</span>'+
      '<span class="hbar" title="Sueldo '+money(r.s)+' · Extras '+money(r.e)+'"><span data-w="'+(r.s/maxT*100)+'%" style="background:var(--lilac)"></span>'+(r.e>0?'<span data-w="'+(r.e/maxT*100)+'%" style="background:var(--accent)"></span>':'')+'</span>'+
      '<span class="v">'+money(r.t)+'</span></div>').join('')+
      '<p class="note" style="margin:6px 0 10px">Durazno: extras · Lila: sueldo.</p></div></div>'+
    '<div class="only-narrow">'+salaryCard.replace('id="salBtn"','id="salBtn2"')+goalCardHtml()+'</div>'+
    '</div></div>';

  countTo(document.getElementById('bigTotal'),'total:'+k,total);
  growBars(m);
  wire(k);
  wireGoals(m);
}

function sheetHtml(){
  if(sheet==='salary'){
    const kNow=periodOf(today()); let opts='';
    for(let i=-2;i<=6;i++){ const s=periodStart(kNow+i); opts+='<option value="'+iso(s)+'"'+(i===0?' selected':'')+'>'+(i===0?'Esta catorcena · ':'')+periodLabel(kNow+i)+'</option>'; }
    return '<section class="sheet" aria-label="Cambiar sueldo"><div class="sheet-head"><b>Cambiar sueldo</b><button type="button" class="btn-ghost" id="close">Cerrar</button></div>'+
      '<label for="salAmt">Nuevo sueldo por catorcena</label><input class="amount-in" id="salAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0">'+
      '<div style="margin-top:12px"><label for="salFrom">A partir de</label><select id="salFrom">'+opts+'</select></div>'+
      '<p class="note">Las catorcenas anteriores conservan el sueldo que tenían.</p><p class="err" id="sheetErr" hidden></p>'+
      '<div class="actions"><button type="button" class="btn-primary grow" id="saveSal">Guardar sueldo</button></div></section>';
  }
  const e=editing?S.extras[editing]:null;
  return '<section class="sheet" aria-label="'+(e?'Editar ingreso extra':'Agregar ingreso extra')+'"><div class="sheet-head"><b>'+(e?'Editar ingreso extra':'Nuevo ingreso extra')+'</b><button type="button" class="btn-ghost" id="close">Cerrar</button></div>'+
    '<label for="exAmt">Monto</label><input class="amount-in" id="exAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(e?Number(e.amount):'')+'">'+
    '<div class="kinds" role="group" aria-label="Tipo de ingreso">'+KINDS.map(x=>'<button type="button" data-k="'+x+'" aria-pressed="'+(x===kind)+'">'+x+'</button>').join('')+'</div>'+
    '<div class="grid2"><div><label for="exConcept">Concepto (opcional)</label><input id="exConcept" type="text" placeholder="ej. Venta de tenis" value="'+esc(e?e.concept:'')+'"></div>'+
    '<div><label for="exDate">Fecha</label><input id="exDate" type="date" value="'+(e?e.date:iso(today()))+'"></div></div>'+
    '<p class="err" id="sheetErr" hidden></p>'+
    '<div class="actions"><button type="button" class="btn-primary grow" id="saveEx">'+(e?'Guardar cambios':'Guardar ingreso')+'</button>'+(e?'<button type="button" class="btn-danger" id="delEx">Borrar</button>':'')+'</div></section>';
}

function err(msg){ const el=document.getElementById('sheetErr'); el.textContent=msg; el.hidden=false; }

function wire(k){
  const $=id=>document.getElementById(id);
  $('prev').onclick=()=>{ offset--; animNext=true; render(); };
  $('nextP').onclick=()=>{ offset++; animNext=true; render(); };
  if($('now')) $('now').onclick=()=>{ offset=0; animNext=true; render(); };
  if($('addBtn')) $('addBtn').onclick=()=>{ sheet='extra'; editing=null; kind='Trabajo extra'; render(); setTimeout(()=>{ try{ $('exAmt').focus(); }catch(e){} },50); };
  ['salBtn','salBtn2'].forEach(x=>{ if($(x)) $(x).onclick=()=>{ sheet='salary'; render(); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>{ try{ $('salAmt').focus(); }catch(e){} },50); }; });

/* ---------- Deudas ---------- */
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function paysOf(id){ return Object.entries(S.pays).filter(([,p])=>p.debtId===id).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')||(b[1].ts||0)-(a[1].ts||0)); }
/* Movimientos que mueven el saldo después del último "Corregir saldo":
   abonos (restan) y gastos con tarjeta de crédito marcados para sumarse (suman). */
function debtMoves(){
  const out=[];
  Object.values(S.pays).forEach(p=>{ const d=S.debts[p.debtId]; if(d && (p.ts||0)>(d.baseTs||0)) out.push({ id:p.debtId, date:p.date, delta:-(Number(p.amount)||0), pay:true }); });
  Object.values(S.exps).forEach(e=>{ const d=S.debts[e.cardId]; if(d && e.method==='credit' && e.toDebt!==false && (e.ts||0)>(d.baseTs||0)) out.push({ id:e.cardId, date:e.date, delta:Number(e.amount)||0, pay:false }); });
  return out;
}
function balanceOf(id){
  const d=S.debts[id]; if(!d) return 0;
  let b=Number(d.base)||0;
  debtMoves().forEach(m=>{ if(m.id===id) b+=m.delta; });
  return Math.max(0, Math.round(b*100)/100);
}
function chargesOf(id){ return debtMoves().filter(m=>m.id===id && !m.pay).reduce((s,m)=>s+m.delta,0); }
function debtsOf(k){ return Object.entries(S.debts).filter(([,d])=>d.kind===k).sort((a,b)=>(a[1].createdTs||0)-(b[1].createdTs||0)); }
const PER_CAT_MONTH=26/12;
function payInfo(d){
  const a=Number(d.amount!=null?d.amount:d.estimate)||0;
  const extra=Number(d.extra)||0;
  if(!d.freq) return { monthly:a, extraMonthly:extra*PER_CAT_MONTH, setup:true, text:'Pago al mes <b>'+money(a)+'</b>' };
  const base = d.kind==='card' ? 'Pago estimado' : (d.fixed ? 'Pago fijo' : 'Pago estimado');
  if(d.freq==='monthly') return { monthly:a, extraMonthly:extra*PER_CAT_MONTH, text: base+' <b>'+money(a)+'</b> el día '+d.day1 };
  if(d.freq==='biweekly') return { monthly:a*2, extraMonthly:extra*PER_CAT_MONTH, text: base+' <b>'+money(a)+'</b> los días '+d.day1+' y '+d.day2+' · '+money(a*2)+' al mes' };
  return { monthly:a*PER_CAT_MONTH, extraMonthly:extra*PER_CAT_MONTH, text: base+' <b>'+money(a)+'</b> cada catorcena' };
}

function debtDayTxt(d){ return d.freq==='monthly' ? 'día '+d.day1 : d.freq==='biweekly' ? 'días '+d.day1+' y '+d.day2 : d.freq==='catorcena' ? 'cada catorcena' : ''; }

  return 'Pago '+money(a)+' al mes';

  const d=S.debts[id], bal=balanceOf(id), orig=Math.max(Number(d.original)||0, bal);

/* ---------- Gráfica de avance ----------
   Se reconstruye con tus abonos: partimos del saldo de hoy y sumamos de regreso
   los abonos posteriores a cada fecha. Una deuda entra a la gráfica el día que la diste de alta
   (o el día de su primer abono, si es anterior). */
function debtSeries(){
  const ids=Object.keys(S.debts); if(!ids.length) return [];
  const t=iso(today());
  const counted=debtMoves().filter(m=>m.date);
  const start={}, set=new Set([t]);
  const made=id=> S.debts[id].createdTs ? iso(new Date(S.debts[id].createdTs)) : t;
  // Las deudas que diste de alta el primer día ya existían antes: si registras abonos con fecha
  // anterior, la gráfica empieza en el abono más antiguo con todas ellas incluidas.
  const firstMade=ids.map(made).sort()[0];
  const oldest=counted.reduce((m,p)=> p.date<m ? p.date : m, firstMade);
  ids.forEach(id=>{
    let c=made(id);
    if(c===firstMade) c=oldest;
    else counted.forEach(p=>{ if(p.id===id && p.date<c) c=p.date; });
    start[id]=c; set.add(c);
  });
  counted.forEach(p=>set.add(p.date));
  const bal={}; ids.forEach(id=>bal[id]=balanceOf(id));
  const first=[...set].sort()[0];
  return [...set].sort().map(day=>{
    let total=0;
    ids.forEach(id=>{ if(start[id]>day) return; let b=bal[id]; counted.forEach(p=>{ if(p.id===id && p.date>day) b-=p.delta; }); total+=b; });
    const dayPays=counted.filter(p=>p.date===day && p.pay), dayCharges=counted.filter(p=>p.date===day && !p.pay);
    const added=ids.filter(id=>start[id]===day && day!==first).map(id=>S.debts[id].name);
    return { day, total:Math.round(total*100)/100, abono:-dayPays.reduce((s,p)=>s+p.delta,0), n:dayPays.length, cargo:dayCharges.reduce((s,p)=>s+p.delta,0), added };
  });
}
const kMoney=v=> Math.abs(v)>=1000 ? '$'+(v/1000).toLocaleString('es-MX',{maximumFractionDigits: v%1000===0?0:1})+'k' : '$'+Math.round(v);
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

function trendBlock(){
  const ser=debtSeries();
  if(!ser.length) return '';
  const paidAll=Object.values(S.pays).filter(p=>S.debts[p.debtId]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const first=ser[0], last=ser[ser.length-1];
  const drop=first.total-last.total;
  const sub = ser.length<2 ? 'Empieza el '+fmt(parseDate(first.day))
    : (drop>0.5 ? 'Bajaste <b>'+money(drop)+'</b> desde el '+fmt(parseDate(first.day)) : 'Desde el '+fmt(parseDate(first.day)));
  const anyC=ser.some(r=>r.cargo>0);
  const rows=ser.slice().reverse().map(r=>'<tr><td>'+fmtLong(parseDate(r.day))+'</td><td>'+(r.abono>0?money(r.abono):'—')+'</td>'+(anyC?'<td>'+(r.cargo>0?money(r.cargo):'—')+'</td>':'')+'<td>'+money(r.total)+'</td></tr>').join('');
  return '<section class="trend" aria-label="Avance de tus deudas">'+
    '<div class="trend-head"><h2>Avance</h2><span class="trend-sub">'+sub+(paidAll>0?' · abonado <b>'+money(paidAll)+'</b>':'')+'</span></div>'+
    (ser.length<2
      ? '<p class="trend-empty">Tu gráfica arranca hoy en <b class="mono" style="color:var(--ink)">'+money(last.total)+'</b>. Cada abono que registres la hará bajar, y aquí verás la línea descender.</p>'
      : '<div class="trend-plot" id="trendPlot"></div>'+
        '<details><summary>Ver como tabla</summary><table><thead><tr><th>Fecha</th><th>Abonos</th>'+(anyC?'<th>Cargos</th>':'')+'<th>Deuda total</th></tr></thead><tbody>'+rows+'</tbody></table></details>')+
  '</section>';
}

function drawTrend(){
  const host=document.getElementById('trendPlot'); if(!host) return;
  const ser=debtSeries(); if(ser.length<2) return;
  const W=Math.max(260, host.clientWidth), wide=W>=640;
  const H=wide?220:170, padL=44, padR=wide?70:58, padT=14, padB=24;
  const t0=parseDate(ser[0].day).getTime(), t1=parseDate(ser[ser.length-1].day).getTime();
  const span=Math.max(1,t1-t0);
  const X=day=> padL+(parseDate(day).getTime()-t0)/span*(W-padL-padR);
  let lo=Math.min(...ser.map(r=>r.total)), hi=Math.max(...ser.map(r=>r.total));
  const rng=Math.max(hi-lo, hi*0.04, 100);
  const step=niceStep((rng*1.3)/3);
  let y0=Math.max(0, Math.floor((lo-rng*0.25)/step)*step), y1=Math.ceil((hi+rng*0.08)/step)*step;
  if(y1<=y0) y1=y0+step;
  const Y=v=> padT+(1-(v-y0)/(y1-y0))*(H-padT-padB);
  // Línea escalonada: el saldo se queda igual hasta el día del abono.
  let d='M'+X(ser[0].day).toFixed(1)+','+Y(ser[0].total).toFixed(1);
  for(let i=1;i<ser.length;i++) d+='H'+X(ser[i].day).toFixed(1)+'V'+Y(ser[i].total).toFixed(1);
  const base=(H-padB).toFixed(1);
  const area=d+'V'+base+'H'+X(ser[0].day).toFixed(1)+'Z';
  let grid='';
  for(let v=y0; v<=y1+0.01; v+=step){ const y=Y(v).toFixed(1); grid+='<line class="gl" x1="'+padL+'" x2="'+(W-padR+8)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(padL-8)+'" y="'+y+'" dy="3.5" text-anchor="end">'+kMoney(v)+'</text>'; }
  // Fechas: inicio, fin y hasta 2 intermedias si caben.
  const nT = wide?4:3, ticks=[];
  for(let i=0;i<nT;i++){ const tt=new Date(t0+span*i/(nT-1)); const day=iso(new Date(tt.getFullYear(),tt.getMonth(),tt.getDate())); if(!ticks.includes(day)) ticks.push(day); }
  const xl=ticks.map((day,i)=>'<text x="'+X(day).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===ticks.length-1?'end':'middle')+'">'+fmt(parseDate(day))+'</text>').join('');
  const L=ser[ser.length-1], lx=X(L.day), ly=Y(L.total);
  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Deuda total de '+money(ser[0].total)+' a '+money(L.total)+'">'+
    '<defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>'+
    grid+xl+'<path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+

    '<g id="trendHover" style="display:none"><line class="xh" y1="'+padT+'" y2="'+(H-padB)+'"/><circle class="pt" r="4.5"/></g>'+
    '<rect id="trendHit" x="'+padL+'" y="0" width="'+(W-padL-padR+12)+'" height="'+H+'" fill="transparent"/></svg><div class="trend-tip" hidden></div>';
  // Trazo que se dibuja al entrar

    const len=ln.getTotalLength(); ln.style.strokeDasharray=len; ln.style.strokeDashoffset=len;
    requestAnimationFrame(()=>{ ln.style.transition='stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)'; ln.style.strokeDashoffset=0; });
    drawTrend.done=true;
  }
  const g=host.querySelector('#trendHover'), xh=g.querySelector('line'), dot=g.querySelector('circle'), tip=host.querySelector('.trend-tip'), svg=host.querySelector('svg');
  const show=clientX=>{
    const r=svg.getBoundingClientRect(), x=(clientX-r.left)*(W/r.width);
    const tAt=t0+(x-padL)/(W-padL-padR)*span;
    let k=0; for(let i=0;i<ser.length;i++){ if(parseDate(ser[i].day).getTime()<=tAt+43200000) k=i; }
    const p=ser[k], px=X(p.day), py=Y(p.total);
    g.style.display=''; xh.setAttribute('x1',px); xh.setAttribute('x2',px); dot.setAttribute('cx',px); dot.setAttribute('cy',py);
    tip.innerHTML=fmtLong(parseDate(p.day))+'<b>'+money2(p.total)+'</b>'+(p.abono>0?'<span class="ab">Abonaste '+money(p.abono)+(p.n>1?' ('+p.n+' abonos)':'')+'</span>':'')+(p.cargo>0?'<span style="display:block">Gastos con tarjeta '+money(p.cargo)+'</span>':'')+(p.added.length?'<span style="display:block">Agregaste '+esc(p.added.join(', '))+'</span>':'');
    tip.hidden=false;
    const sx=px*r.width/W, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw, sx+12>r.width-tw ? sx-tw-12 : sx+12))+'px';
  };
  const hide=()=>{ g.style.display='none'; tip.hidden=true; };
  const hit=host.querySelector('#trendHit');
  hit.addEventListener('pointermove',e=>show(e.clientX));
  hit.addEventListener('pointerdown',e=>show(e.clientX));
  hit.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hide(); });
  if(!drawTrend.outside){ drawTrend.outside=true; document.addEventListener('pointerdown',e=>{ if(e.target.id!=='trendHit'){ const t=document.querySelector('.trend-tip'), h=document.getElementById('trendHover'); if(t) t.hidden=true; if(h) h.style.display='none'; } }); }
}

/* Confirmación en su propio modal, encima de lo que esté abierto. Resuelve true solo si tocas el botón rojo. */
let confirmDone=null;
function askConfirm({ title, msg, ok='Sí, borrar', detail='', warn=true }){
  return new Promise(res=>{
    if(confirmDone) confirmDone(false);
    const prevFocus=document.activeElement;
    const back=document.createElement('div'); back.className='modal-back confirm-back'; back.id='confirmBack';
    back.innerHTML='<div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfM">'+
      '<div class="cf-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>'+
      '<h3 id="cfT">'+title+'</h3><p class="sub" id="cfM">'+msg+'</p>'+(detail?'<div class="cf-detail">'+detail+'</div>':'')+
      (warn?'<p class="cf-warn">No se puede deshacer.</p>':'')+
      '<div class="actions"><button type="button" class="btn-ghost grow" id="cfNo">No, cancelar</button><button type="button" class="btn-danger grow" id="cfYes">'+ok+'</button></div></div>';
    document.body.appendChild(back);
    const done=v=>{ if(!back.isConnected) return; back.remove(); confirmDone=null; try{ prevFocus&&prevFocus.focus&&prevFocus.focus(); }catch(e){} res(v); };
    confirmDone=done;
    back.addEventListener('click',e=>{ if(e.target===back) done(false); });
    back.querySelector('#cfNo').onclick=()=>done(false);
    back.querySelector('#cfYes').onclick=()=>done(true);
    setTimeout(()=>{ try{ back.querySelector('#cfNo').focus(); }catch(e){} },40);
  });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(confirmDone){ confirmDone(false); return; } if(typeof closePicker==='function' && closePicker()) return; closeModal(); } });
