}
const G={ amt:'', cat:null, method:'debit', cardId:null, toDebt:null, date:null, note:'' };
/* Si la compra es anterior al saldo que registraste de la tarjeta, seguramente ya viene incluida:
   por defecto no se vuelve a sumar (puedes marcarlo tú). toDebt null = automático. */
function baseDay(id){ const d=S.debts[id]; return d && d.baseTs>1 ? iso(new Date(d.baseTs)) : '0000'; }
function autoToDebt(st){ return (st.date||iso(today())) >= baseDay(st.cardId); }
function toDebtOf(st){ return st.toDebt==null ? autoToDebt(st) : st.toDebt; }

function catList(){
  const seen=new Set(DEF_CATS.map(n=>n.toLowerCase()).concat(['otro']));
  const custom=Object.values(S.cats).sort((a,b)=>(a.ts||0)-(b.ts||0)).map(c=>c.name).filter(n=>{ const k=String(n).toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
  return [...DEF_CATS, ...custom, 'Otro'];
}
function cardName(e){ const d=S.debts[e.cardId]; return d ? d.name : (e.cardName||'tarjeta'); }
function methodLabel(e){ return e.method==='credit' ? 'Crédito '+cardName(e) : methodName(e.method); }

function gRange(){
  const t=today();
  if(gView==='day'){ const d=addDays(t,gOff); return { a:d, b:d, label: gOff===0?'Hoy · '+fmtLong(d):gOff===-1?'Ayer · '+fmtLong(d):fmtLong(d) }; }
  if(gView==='week'){ const mon=addDays(t, -((t.getDay()+6)%7) + 7*gOff), sun=addDays(mon,6);
    return { a:mon, b:sun, label:(gOff===0?'Esta semana · ':'')+fmt(mon)+' – '+fmt(sun) }; }
  if(gView==='month'){ const a=new Date(t.getFullYear(), t.getMonth()+gOff, 1), b=new Date(a.getFullYear(), a.getMonth()+1, 0);
    return { a, b, label: MESL[a.getMonth()]+' '+a.getFullYear() }; }
  const y=t.getFullYear()+gOff; return { a:new Date(y,0,1), b:new Date(y,11,31), label:String(y) };
}
function expsIn(a,b){ const A=iso(a), B=iso(b); return Object.entries(S.exps).filter(([,e])=>e.date>=A && e.date<=B).sort((x,y)=>y[1].date.localeCompare(x[1].date)||(y[1].ts||0)-(x[1].ts||0)); }

/* Campos del gasto: los usa el formulario rápido y el modal de edición. */
function expFields(p, st, inModal){
  const cards=debtsOf('card');
  let h='<label for="'+p+'Amt">Monto</label><input class="amount-in" id="'+p+'Amt" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(st.amt)+'">'+
    '<span class="flabel">¿En qué fue?</span><div class="kinds tight" role="group" aria-label="Categoría">'+
      catList().map(c=>'<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+(st.cat===c)+'">'+esc(c)+'</button>').join('')+
      (st.cat && !catList().includes(st.cat) ? '<button type="button" data-cat="'+esc(st.cat)+'" aria-pressed="true">'+esc(st.cat)+'</button>' : '')+
      (inModal?'':'<button type="button" class="newcat" data-newcat>+ Categoría</button>')+'</div>'+
    '<span class="flabel">¿Cómo pagaste?</span><div class="seg" role="group" aria-label="Método de pago">'+
      METHODS.map(([k,n])=>'<button type="button" data-m="'+k+'" aria-pressed="'+(st.method===k)+'">'+n+'</button>').join('')+'</div>';
  if(st.method==='credit'){
    h+='<span class="flabel">¿Con cuál tarjeta?</span>';
    if(!cards.length && !st.cardId) h+='<p class="note" style="margin:0">Aún no tienes tarjetas. Agrégalas en la pestaña Deudas y aquí aparecerán.</p>';
    else {
      h+='<div class="kinds tight" role="group" aria-label="Tarjeta">'+cards.map(([id,d])=>'<button type="button" data-card="'+id+'" aria-pressed="'+(st.cardId===id)+'">'+esc(d.name)+'</button>').join('')+
        (st.cardId && !S.debts[st.cardId] ? '<button type="button" aria-pressed="true" disabled>'+esc(st.cardName||'Tarjeta borrada')+'</button>' : '')+'</div>';
      if(st.cardId && S.debts[st.cardId]) h+='<label class="chk"><input type="checkbox" id="'+p+'ToDebt"'+(toDebtOf(st)?' checked':'')+'> Sumar a la deuda de '+esc(S.debts[st.cardId].name)+'</label><p class="live" id="'+p+'Live"></p>';
    }
  }
  h+='<div class="grid2"><div><label for="'+p+'Date">Fecha</label><input id="'+p+'Date" type="date" value="'+(st.date||iso(today()))+'"></div>'+
     '<div><label for="'+p+'Note">Nota (opcional)</label><input id="'+p+'Note" type="text" autocomplete="off" placeholder="ej. Pemex, Soriana" value="'+esc(st.note)+'"></div></div>';
  return h;
}
function wireExpFields(box, p, st, repaint, editId){
  const q=s=>box.querySelector(s);
  const live=()=>{ const el=q('#'+p+'Live'); if(!el) return; const v=parseAmt(st.amt), d=S.debts[st.cardId];
    if(!d) { el.innerHTML=''; return; }
    if(!toDebtOf(st)){ el.innerHTML= (st.date||iso(today()))<baseDay(st.cardId) ? 'Es anterior al saldo que registraste de '+esc(d.name)+' ('+fmt(parseDate(baseDay(st.cardId)))+'), así que seguramente ya está incluido. No se sumará.' : 'No se sumará a la deuda de '+esc(d.name)+'.'; return; }
    let bal=balanceOf(st.cardId); if(editId){ const old=S.exps[editId]; if(old && old.method==='credit' && old.cardId===st.cardId && old.toDebt!==false && (old.ts||0)>(d.baseTs||0)) bal-=Number(old.amount)||0; }
    el.innerHTML= isFinite(v)&&v>0 ? esc(d.name)+' quedará en <b>'+money2(bal+v)+'</b>' : 'Ahora debes '+money2(bal)+' en '+esc(d.name); };
  q('#'+p+'Amt').addEventListener('input',e=>{ st.amt=e.target.value; live(); });
  q('#'+p+'Date').addEventListener('input',e=>{ st.date=e.target.value; const c=q('#'+p+'ToDebt'); if(c && st.toDebt==null) c.checked=autoToDebt(st); live(); });
  q('#'+p+'Note').addEventListener('input',e=>{ st.note=e.target.value; });
  box.querySelectorAll('[data-cat]').forEach(b=> b.onclick=()=>{ st.cat=b.dataset.cat; box.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  box.querySelectorAll('[data-m]').forEach(b=> b.onclick=()=>{ if(st.method===b.dataset.m) return; st.method=b.dataset.m;
    if(st.method==='credit' && !st.cardId){ const c=debtsOf('card'); if(c.length===1) st.cardId=c[0][0]; }
    repaint(); });
  box.querySelectorAll('[data-card]').forEach(b=> b.onclick=()=>{ if(st.cardId!==b.dataset.card && !editId) st.toDebt=null; st.cardId=b.dataset.card; repaint(); });
  const td=q('#'+p+'ToDebt'); if(td) td.onchange=()=>{ st.toDebt=td.checked; live(); };
  const nc=q('[data-newcat]'); if(nc) nc.onclick=()=> openCats();
  live();
}
function expData(st, box, p, keepTs){
  const v=parseAmt(st.amt); if(!isFinite(v)||v<=0) return { err:'Escribe el monto, por ejemplo 250 o 89.50.' };
  if(!st.cat) return { err:'Elige en qué fue el gasto.' };
  const date=box.querySelector('#'+p+'Date').value; if(!date) return { err:'Elige la fecha.' };
  const data={ amount:Math.round(v*100)/100, date, cat:st.cat, method:st.method, note:String(st.note||'').trim(), ts: keepTs||Date.now() };
  if(st.method==='credit'){
    if(!st.cardId) return { err: debtsOf('card').length ? 'Elige con cuál tarjeta pagaste.' : 'Primero agrega tu tarjeta en Deudas, o elige otro método.' };
    data.cardId=st.cardId; data.cardName=S.debts[st.cardId]?S.debts[st.cardId].name:(st.cardName||''); data.toDebt= toDebtOf(st);
  } else { data.cardId=null; data.cardName=null; data.toDebt=false; }
  return { data };
}

function renderGastos(){
  const m=main();
  if(!(S.loaded.exps && S.loaded.cats && S.loaded.debts && S.loaded.pays && S.loaded.fixed)){ m.innerHTML='<div class="welcome"><p style="margin:0">Cargando tus gastos…</p></div>'; return; }
  // Conserva el foco y lo que estabas escribiendo si llega una actualización.
  const ae=document.activeElement, fid= ae && m.contains(ae) && ae.id ? ae.id : null, sel= fid && ae.selectionStart!=null ? [ae.selectionStart, ae.selectionEnd] : null;
  const r=gRange(), list=expsIn(r.a,r.b), total=list.reduce((s,[,e])=>s+(Number(e.amount)||0),0);
  const byCat={}, byM={debit:0,credit:0,cash:0};
  list.forEach(([,e])=>{ const a=Number(e.amount)||0; byCat[e.cat]=(byCat[e.cat]||0)+a; byM[e.method]=(byM[e.method]||0)+a; });
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(gCat && !byCat[gCat]) gCat=null;
  const maxC=Math.max(1,...cats.map(c=>c[1]));
  const shown= gCat ? list.filter(([,e])=>e.cat===gCat) : list;
  const isNow=gOff===0;
  m.innerHTML=inboxHtml()+
    '<div class="layout glayout"><div class="col-a">'+
      '<section class="gform" aria-label="Registrar gasto"><div class="sheet-head"><b>Registrar gasto</b></div><div id="gFields">'+expFields('g',G,false)+'</div>'+
      '<p class="err" id="gErr" hidden></p><button type="button" class="btn-primary add" id="gSave">Guardar gasto</button></section>'+
      fixedSectionHtml()+
    '</div><div class="col-b">'+
      '<section class="hero gsum" aria-label="Total gastado">'+
        '<div class="seg gview" role="group" aria-label="Ver por">'+VIEWS.map(([k,n])=>'<button type="button" data-v="'+k+'" aria-pressed="'+(gView===k)+'">'+n+'</button>').join('')+'</div>'+
        '<div class="gnav"><button type="button" id="gPrev" aria-label="Anterior">‹</button><span class="lbl">'+r.label+'</span><span class="gnav-r">'+(isNow?'':'<button type="button" id="gNow">Hoy</button>')+'<button type="button" id="gNext" aria-label="Siguiente">›</button></span></div>'+
        '<div class="cap">Gastado</div><div class="big" id="bigG">'+money2(total)+'</div>'+
        '<div class="gmeth">'+METHODS.map(([k,n])=>'<span>'+n+' <b>'+money2(byM[k]||0)+'</b></span>').join('')+'</div>'+
        '<div class="cats">'+(cats.length? cats.map(([c,v])=>
          '<button type="button" class="crow" data-fc="'+esc(c)+'" aria-pressed="false"><span class="n">'+esc(c)+'</span><span class="v">'+money2(v)+'<small>'+Math.round(v/total*100)+'%</small></span><span class="meter" aria-hidden="true"><span data-w="'+(v/maxC*100)+'%"></span></span></button>').join('')+
          '<p class="note" style="margin:8px 6px 0">Toca una categoría para ver sus gastos.</p>'
          : '<p class="note" style="margin:0">Sin gastos en este periodo.</p>')+'</div>'+
      '</section>'+
      '<div class="ghead"><h2>Movimientos'+(list.length?'<span>'+list.length+'</span>':'')+'</h2>'+(list.length?'<div class="seg ggrp" role="group" aria-label="Agrupar por"><button type="button" data-gg="cat" aria-pressed="'+(gGroup==='cat')+'">Categoría</button><button type="button" data-gg="date" aria-pressed="'+(gGroup==='date')+'">Fecha</button></div>':'')+'</div>'+
      '<div id="gList">'+gMovesHtml(list,cats,total,isNow)+'</div>'+

    '</div></div>';
  countTo(document.getElementById('bigG'),'g:'+gView+':'+gOff,total,money2);
  growBars(m);
  const $=id=>document.getElementById(id);
  const form=m.querySelector('.gform'), fields=$('gFields');
  const repaint=()=>{ fields.innerHTML=expFields('g',G,false); wireExpFields(fields,'g',G,repaint); };
  wireExpFields(fields,'g',G,repaint);
  form.querySelectorAll('input[type=text],input[type=date]').forEach(i=> i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('gSave').click(); } }));
  $('gSave').onclick=async()=>{
    const {err:er,data}=expData(G,form,'g'); const eb=$('gErr');
    if(er){ eb.textContent=er; eb.hidden=false; return; }
    const btn=$('gSave'); btn.disabled=true; btn.textContent='Guardando…';
    const ok=await saved(db.collection('expenses').add(data));
    if(!ok){ btn.disabled=false; btn.textContent='Guardar gasto'; return; }
    toast('Gasto de '+money2(data.amount)+' en '+data.cat+' guardado'+(data.toDebt?' · sumado a '+data.cardName:''));
    G.amt=''; G.note=''; G.cat=null; G.date=null; G.toDebt=null;
    renderGastos();
  };
  m.querySelectorAll('[data-v]').forEach(b=> b.onclick=()=>{ if(gView===b.dataset.v) return; gView=b.dataset.v; gOff=0; gCat=null; animNext=true; try{ localStorage.setItem('cc2-gv',gView); }catch(e){} renderGastos(); });
  $('gPrev').onclick=()=>{ gOff--; gCat=null; animNext=true; renderGastos(); };
  $('gNext').onclick=()=>{ gOff++; gCat=null; animNext=true; renderGastos(); };
  if($('gNow')) $('gNow').onclick=()=>{ gOff=0; gCat=null; animNext=true; renderGastos(); };
  wireInbox(m);
  m.querySelectorAll('[data-gg]').forEach(b=> b.onclick=()=>{ if(gGroup===b.dataset.gg) return; gGroup=b.dataset.gg; try{ localStorage.setItem('cc2-ggroup',gGroup); }catch(e){} renderGastos(); });
  m.querySelectorAll('[data-gacc]').forEach(b=> b.onclick=()=>{ const c=b.dataset.gacc, sec=b.closest('.acc'), open=!gOpen.has(c); if(open) gOpen.add(c); else gOpen.delete(c); sec.classList.toggle('open',open); b.setAttribute('aria-expanded',open); });
  m.querySelectorAll('[data-fc]').forEach(b=> b.onclick=()=>{
    const c=b.dataset.fc; gOpen.add(c);
    if(gGroup!=='cat'){ gGroup='cat'; try{ localStorage.setItem('cc2-ggroup','cat'); }catch(e){} renderGastos(); }
    const sec=[...m.querySelectorAll('[data-gcat]')].find(x=>x.dataset.gcat===c); if(!sec) return;
    sec.classList.add('open'); sec.querySelector('.acc-head').setAttribute('aria-expanded','true');
    setTimeout(()=> sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start' }), 60);
    sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash');
  });
  m.querySelectorAll('#gList .row').forEach(b=> b.onclick=()=> openExp(b.dataset.id));
  const fxHead=$('fxToggle');
  if(fxHead) fxHead.onclick=()=>{ gFixOpen=!gFixOpen; try{ localStorage.setItem('cc2-fixopen', gFixOpen?'1':'0'); }catch(e){}
    fxHead.closest('.acc').classList.toggle('open', gFixOpen); fxHead.setAttribute('aria-expanded', gFixOpen); };
  if($('fxAdd')) $('fxAdd').onclick=()=> openFixedForm(null);
  m.querySelectorAll('[data-fx]').forEach(b=> b.onclick=()=> openFixedForm(b.dataset.fx));
  if(fid && $(fid)){ const el=$(fid); try{ el.focus({preventScroll:true}); if(sel && el.setSelectionRange) el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
}

/* Gastos fijos (gym, teléfono…): se dan de alta aquí; Separar los reparte según su día. */
let gFixOpen=false; try{ gFixOpen=localStorage.getItem('cc2-fixopen')==='1'; }catch(e){}
function fixedMonthly(f){ const a=Number(f.amount)||0; return f.freq==='biweekly'?a*2 : f.freq==='interval'?a*365/28/12 : f.freq==='catorcena'?a*26/12 : a; }
function fixedSectionHtml(){
  const list=Object.entries(S.fixed).sort((a,b)=>(a[1].createdTs||0)-(b[1].createdTs||0));
  const tot=list.reduce((s,[,f])=>s+fixedMonthly(f),0);
  return '<section class="acc fxacc'+(gFixOpen?' open':'')+'">'+
    '<button type="button" class="acc-head" id="fxToggle" aria-expanded="'+gFixOpen+'"><span class="dot" style="background:var(--fixed)"></span>'+
      '<span class="tt"><b>Gastos fijos</b><span>'+(list.length? list.length+' · ~'+money(tot)+' al mes' : 'gym, teléfono, internet…')+'</span></span>'+
      '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '<div class="acc-body"><div class="acc-in"><div class="inner">'+
      (list.length? list.map(([fid,f])=>'<button type="button" class="row fxrow" data-fx="'+fid+'"><span class="grow"><span class="t">'+esc(f.name)+'</span><span class="s">'+fixedWhen(f)+'</span></span><span class="amt">'+money2(f.amount)+'</span></button>').join('')
        : '<p class="empty" style="padding:6px 8px 4px">Los pagos que salen siempre y no son deudas. Separar los reparte entre tus catorcenas según su día, y cuando los pagas quedan aquí en Gastos.</p>')+
      '<button type="button" class="fxadd" id="fxAdd">+ Agregar gasto fijo</button>'+
    '</div></div></div></section>';
}

function openNewExp(pre){
  if(!(db && S.loaded.exps && S.loaded.debts && S.loaded.cats)) return;
  if(pre && pre.type) pre=null; // llamado desde un clic
  const st= pre ? Object.assign({ amt:'', cat:null, method:'debit', cardId:null, toDebt:null, date:null, note:'' }, pre)
               : { amt:'', cat:null, method:G.method||'debit', cardId:G.method==='credit'?G.cardId:null, toDebt:null, date:null, note:'' };
  const inboxId= pre ? pre.inboxId : null;
  openModal('<h3>'+(inboxId?'Revisar compra':'Registrar gasto')+'</h3><p class="sub">'+(inboxId?'Llegó de Apple Pay'+(pre.rawCard?' · '+esc(pre.rawCard):'')+'. Elige la categoría y revisa cómo pagaste.':'Se guarda en Gastos con su categoría y cómo pagaste.')+'</p><div id="qFields">'+expFields('q',st,true)+'</div><p class="err" hidden></p>'+
    '<div class="actions"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary grow" id="qSave">Guardar gasto</button></div>', box=>{
    const fields=box.querySelector('#qFields'), save=box.querySelector('#qSave');
    const repaint=()=>{ fields.innerHTML=expFields('q',st,true); wireExpFields(fields,'q',st,repaint); onEnter(box,save); };
    wireExpFields(fields,'q',st,repaint); onEnter(box,save);
    save.onclick=async()=>{
      const {err:er,data}=expData(st,box,'q'); if(er) return mErr(box,er);
      save.disabled=true; save.textContent='Guardando…';
      const learn= inboxId ? [db.doc('config/cardmap').set(Object.assign({}, S.cardmap||{}, { [cardKey(pre.rawCard)]:{ method:st.method, cardId:st.method==='credit'?st.cardId:null } }))] : [];
      const ok=await saved(Promise.all([db.collection('expenses').add(data), ...(inboxId?[db.collection('inbox').doc(inboxId).delete()]:[]), ...learn]));
      if(!ok){ save.disabled=false; save.textContent='Guardar gasto'; return; }
      G.method=st.method; G.cardId=st.cardId;
      closeModal(); toast('Gasto de '+money2(data.amount)+' en '+data.cat+' guardado'+(data.toDebt?' · sumado a '+data.cardName:''));
    };
  });
}

function openExp(id){
  const e=S.exps[id]; if(!e) return;
  const st={ amt:String(e.amount), cat:e.cat, method:e.method||'debit', cardId:e.cardId||null, cardName:e.cardName, toDebt:e.toDebt!==false, date:e.date, note:e.note||'' };
  openModal('<h3>Editar gasto</h3><p class="sub">Registrado el '+fmtLong(parseDate(e.date))+'</p><div id="mFields">'+expFields('m',st,true)+'</div><p class="err" hidden></p>'+
    '<div class="actions"><button type="button" class="btn-danger" id="mDel">Borrar</button><button type="button" class="btn-primary grow" id="mSave">Guardar cambios</button></div>', box=>{
    const fields=box.querySelector('#mFields'), save=box.querySelector('#mSave');
    const repaint=()=>{ fields.innerHTML=expFields('m',st,true); wireExpFields(fields,'m',st,repaint,id); onEnter(box,save); };
    wireExpFields(fields,'m',st,repaint,id); onEnter(box,save);
    save.onclick=async()=>{
      const {err:er,data}=expData(st,box,'m',e.ts||Date.now()); if(er) return mErr(box,er);
      if(e.occ){ data.occ=e.occ; data.fixedId=e.fixedId||null; }
      save.disabled=true; save.textContent='Guardando…';
      const ok=await saved(db.collection('expenses').doc(id).set(data));
      if(!ok){ save.disabled=false; save.textContent='Guardar cambios'; return; }
      closeModal(); toast('Gasto actualizado');
    };
    const del=box.querySelector('#mDel');
    del.onclick=async()=>{
      if(!await askConfirm({ title:'¿Borrar este gasto?', msg:'Se quita de tus gastos'+(e.method==='credit'&&e.toDebt!==false?' y del saldo de '+esc(cardName(e)):'')+(e.occ?'. El pago vuelve a quedar pendiente en Separar':'')+'.', detail:'<b>'+money2(e.amount)+'</b> · '+esc(e.cat||'Gasto')+(e.note?' · '+esc(e.note):'')+' · '+fmtLong(parseDate(e.date)), ok:'Sí, borrar gasto' })) return;
      del.disabled=true;
      const ok=await saved(db.collection('expenses').doc(id).delete());
      if(!ok){ del.disabled=false; return; }
      closeModal(); toast('Gasto borrado'+(e.method==='credit'&&e.toDebt!==false?' · se quitó de '+cardName(e):''));
    };
  });
}

  const custom=Object.entries(S.cats).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  openModal('<h3>Nueva categoría</h3><p class="sub">Aparecerá junto a las demás para tus próximos gastos.</p>'+

    (custom.length?'<div class="optional"><label>Tus categorías</label><div class="mycats">'+custom.map(([cid,c])=>'<span class="mycat">'+esc(c.name)+'<button type="button" data-del="'+cid+'" aria-label="Quitar '+esc(c.name)+'">Quitar</button></span>').join('')+'</div>'+
      '<p class="hint">Quitar una categoría no borra los gastos que ya tiene.</p></div>':'')+
    '<p class="err" hidden></p><div class="actions"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary grow" id="mSave">Agregar categoría</button></div>', box=>{
    const save=box.querySelector('#mSave'); onEnter(box,save);
    save.onclick=async()=>{
      const raw=box.querySelector('#mCat').value.trim().replace(/\s+/g,' ');

      if(catList().some(c=>c.toLowerCase()===name.toLowerCase())) return mErr(box,'Ya tienes una categoría llamada '+name+'.');
      save.disabled=true; save.textContent='Guardando…';
      const ok=await saved(db.collection('expCats').add({ name, ts:Date.now() }));
      if(!ok){ save.disabled=false; save.textContent='Agregar categoría'; return; }
      G.cat=name; closeModal(); toast('Categoría '+name+' agregada'); render();
    };
    box.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{
      const nm=S.cats[b.dataset.del].name;
      if(!await askConfirm({ title:'¿Quitar la categoría '+esc(nm)+'?', msg:'Los gastos que ya tiene no se borran.', ok:'Sí, quitar' })) return;
      b.disabled=true;
      const ok=await saved(db.collection('expCats').doc(b.dataset.del).delete());
      if(!ok){ b.disabled=false; return; }
      if(G.cat===nm) G.cat=null;
      b.closest('.mycat').remove(); toast('Categoría '+nm+' quitada');
    });
  });
}

/* ---------- Separar ----------
   Cada pago de una deuda se reparte entre las catorcenas que cobras desde el pago anterior
   hasta su fecha límite. Lo que ya separaste (de antes o en catorcenas pasadas) se descuenta,
   y si separas de menos, lo que falta pasa solo a las siguientes catorcenas. */
let sOff=0;
const HORIZON=13;
const cents=n=>Math.round(n*100)/100;
function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }
function dueList(d, from, until){
  const out=[];
  if(d.freq==='interval'){
    const step=Number(d.every)||28; if(!d.next) return out;
    let dt=parseDate(d.next); while(dt>from) dt=addDays(dt,-step); while(dt<from) dt=addDays(dt,step);
    while(dt<=until){ out.push(new Date(dt)); dt=addDays(dt,step); }
    return out;
  }
  if(d.freq!=='monthly' && d.freq!=='biweekly') return out;
  const days=[Number(d.day1)].concat(d.freq==='biweekly'?[Number(d.day2)]:[]).filter(x=>x>=1&&x<=31);
  let y=from.getFullYear(), m=from.getMonth();
  while(new Date(y,m,1)<=until){
    days.forEach(dd=>{ const dt=new Date(y,m,Math.min(dd,lastDay(y,m))); if(dt>=from && dt<=until) out.push(dt); });
    m++; if(m>11){ m=0; y++; }
  }
  return out.sort((a,b)=>a-b);
}
function sepKey(payday,id,due){ return payday+'_'+id+'_'+due; }
function splitEven(total,n){
  if(n<=1) return [cents(total)];
  const base=Math.floor(total/n); const arr=Array(n).fill(base); arr[n-1]=cents(total-base*(n-1)); return arr;
}
/* El plan arranca en la catorcena actual, o en sepStart si es posterior
   (lo de antes ya lo separaste por fuera). */
function sepK0(){ const k=periodOf(today()); return S.sepStart ? Math.max(k, periodOf(parseDate(S.sepStart))) : k; }
function computeSep(){
  const K0=sepK0();
  const P=[]; for(let i=0;i<HORIZON+3;i++) P.push(iso(periodStart(K0+i)));
  const start=P[0], until=addDays(parseDate(P[HORIZON]),45);
  const plan={}; P.forEach(p=>plan[p]=[]);
  const recs=Object.values(S.sep);
  const before=(id,due)=> recs.filter(r=>r.debtId===id && r.due===due && r.payday<start).reduce((s,r)=>s+(Number(r.amount)||0),0);
  const recAt=(p,id,due)=> S.sep[sepKey(p,id,due)];
  const skipped=[];
  const nameCount={}; Object.values(S.debts).forEach(d=>{ const k=String(d.name).toLowerCase(); nameCount[k]=(nameCount[k]||0)+1; });
  const label=d=> nameCount[String(d.name).toLowerCase()]>1 ? d.name+' ('+(d.kind==='card'?'tarjeta':'préstamo')+')' : d.name;
  const paidMap=paidOccs(), pending=[];
  // "Por pagar": pagos que vencen antes de la catorcena del plan (desde que empezaste a usar la app, máx. 35 días atrás) y no registraste.
  const lo=[iso(addDays(today(),-35)), S.anchor||'0000'].sort().pop();
  const pastPaydays=[]; for(let k=periodOf(parseDate(lo)); k<K0; k++){ const x=iso(periodStart(k)); if(x>=lo) pastPaydays.push(x); }
  const planOne=(id,d,remaining,name,grp)=>{
    const amt0=Number(d.amount)||0, extra=Number(d.extra)||0;
    const ev=[];
    { const pend=[];
      if(d.freq==='catorcena') pastPaydays.forEach(x=>pend.push({kind:'due', date:x, key:x}));
      else dueList(d, parseDate(lo), addDays(parseDate(start),-1)).map(iso).forEach(x=>pend.push({kind:'due', date:x, key:x}));
      if(extra>0 && grp==='debt') pastPaydays.forEach(x=>pend.push({kind:'extra', date:x, key:'x'+x}));
      if(grp==='debt') pastPaydays.forEach(x=>{ if(snowAt(d,x)>0) pend.push({kind:'extra', date:x, key:'s'+x, snow:true}); });
      let left=remaining;
      pend.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        const pi=paidMap[id+'|'+e.key]; if(pi && pi.ext) return;
        const full=e.kind==='extra'?(e.snow?snowAt(d,e.date):extra):amt0, pAmt=pi?pi.amount:0;
        const amt=cents(Math.min(Math.max(0,full-pAmt), left)); if(amt<=0.5) return; left-=amt;
        pending.push({ id, name, grp: e.kind==='extra'?'extra':grp, kind:e.kind, due:e.date, key:e.key, amount:full, toPay:amt, paidAmt:pAmt, share:amt, part:1, of:1, already:0, snow:!!e.snow, snowSrc:e.snow?snowSrcNames(d,e.date):'' });
      });
    }
    if(d.freq==='catorcena'){ P.forEach(p=>ev.push({kind:'due', date:p, key:p, amount:amt0, W:[p]})); }
    else {
      const dues=dueList(d, addDays(parseDate(start),-70), until).map(iso);
      dues.forEach((due,i)=>{
        if(due<start) return;
        const prev=dues[i-1]||iso(addDays(parseDate(due),-31));
        let W=P.filter(p=>p>prev && p<=due && p>=start), urgent=false;
        if(!W.length){ W=[P.filter(p=>p<=due).pop()||start]; urgent=true; }
        ev.push({kind:'due', date:due, key:due, amount:amt0, W, urgent});
      });
    }
    if(extra>0 && grp==='debt') P.forEach(p=>ev.push({kind:'extra', date:p, key:'x'+p, amount:extra, W:[p]}));
    if(grp==='debt') P.forEach(p=>{ const a=snowAt(d,p); if(a>0) ev.push({kind:'extra', date:p, key:'s'+p, amount:a, W:[p], snow:true}); });
    // En orden de fecha; el mismo día, primero el pago obligatorio.
    ev.sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='due'?-1:1));
    ev.forEach(e=>{
      // Lo ya pagado de esta fecha (abonos o gastos ligados) se descuenta de lo que falta pagar;
      // como el saldo ya refleja esos abonos, solo lo que falta pagar consume el saldo restante.
      const pinfo=paidMap[id+'|'+e.key];
      const paidAmt= pinfo ? (pinfo.ext ? Infinity : pinfo.amount) : 0;
      let toPay=Math.max(0, cents(e.amount-paidAmt));
      if(toPay>0.005) toPay=cents(Math.min(toPay, remaining));
      if(!pinfo && toPay<=0.005) return;
      const paid= pinfo && toPay<=0.5 ? pinfo : null;
      if(paid) toPay=0;
      remaining=cents(remaining-toPay);
      const amt=cents(e.amount);
      const liq=!paid && grp==='debt' && remaining<=0.5;
      // Si ya está pagado completo, lo que tocaba separar en esta catorcena se sigue mostrando (y contando).
      const already=before(id,e.key), need=Math.max(0,cents((paid?amt:toPay)-already));
      const shares=splitEven(need, e.W.length);
      const r0=e.W[0]===start ? recAt(start,id,e.key) : null;
      if(r0 && e.W.length>1){
        const diff=shares[0]-(Number(r0.amount)||0), per=diff/(e.W.length-1);
        for(let i=1;i<shares.length;i++) shares[i]=Math.max(0,cents(shares[i]+per));
      }
      // Lo que decidiste pasar de una catorcena a la siguiente (siempre antes de la fecha de pago).
      const mOut=e.W.map(()=>0), mIn=e.W.map(()=>0), mFrom=e.W.map(()=>[]);
      if(!paid) recs.filter(r=>r.move && r.id===id && r.key===e.key && r.from>=start).sort((a,b)=>a.from.localeCompare(b.from)).forEach(r=>{
        const i=e.W.indexOf(r.from), j=e.W.indexOf(r.to); if(i<0 || j<=i) return;
        const x=cents(Math.min(Number(r.amount)||0, shares[i])); if(x<=0) return;
        shares[i]=cents(shares[i]-x); shares[j]=cents(shares[j]+x); mOut[i]=cents(mOut[i]+x); mIn[j]=cents(mIn[j]+x); mFrom[j].push(r.from);
      });
      e.W.forEach((p,i)=>{
        if(!plan[p]) return;
        if(paid && p>start) return; // ya pagado: nada más que separar después
        const rec=recAt(p,id,e.key);
        if(shares[i]<=0.005 && !rec && !paid && !mOut[i] && !(p===start && (already>0 || (pinfo && !pinfo.ext)))) return;
        const canMove= e.kind==='due' && !paid && !rec && i<e.W.length-1 && shares[i]>0.5;
        plan[p].push({ id, name, grp: e.kind==='extra'?'extra':grp, kind:e.kind, due:e.date, key:e.key, amount:amt, toPay, paidAmt: pinfo&&!pinfo.ext?pinfo.amount:0, share:shares[i], part:i+1, of:e.W.length, already, liq, urgent:!!e.urgent, rec, paid, snow:!!e.snow, snowSrc:e.snow?snowSrcNames(d,e.date):'',
          movedOut:mOut[i], movedTo:mOut[i]?e.W[i+1]:null, movedIn:mIn[i], movedFrom:mFrom[i], moveTo:canMove?e.W[i+1]:null, payday:p });
      });
    });
  };
  Object.entries(S.debts).sort((a,b)=>(a[1].createdTs||0)-(b[1].createdTs||0)).forEach(([id,d])=>{
    const bal=balanceOf(id);
    if(!d.freq){ if(bal>0.5) skipped.push(d.name); return; }
    planOne(id,d,bal,label(d),'debt');
  });
  // Pagos fijos (gym, teléfono…): sin saldo que se acabe.
  Object.entries(S.fixed).sort((a,b)=>(a[1].createdTs||0)-(b[1].createdTs||0)).forEach(([fid,f])=>{
    if(!(Number(f.amount)>0)) return;
    planOne('f-'+fid, f, Infinity, f.name, 'fixed');
  });
  // Ahorro: lo que toca guardar de cada pago hasta llegar a la meta.
  goalList().forEach(([gid,g])=>{
    const pr=goalProjection(gid), id='g-'+gid;
    Object.entries(pr.byP).forEach(([p,v])=>{
      if(!plan[p]) return;
      const key='v'+p, rec=recAt(p,id,key), paid=v.paid ? paidMap[id+'|'+key] : null;
      plan[p].push({ id, name:g.name, grp:'save', kind:'save', due:p, key, amount:v.amount, toPay:v.paid?0:v.amount, paidAmt:0, share:v.amount, part:1, of:1, already:0, liq:false, urgent:false, rec, paid, goalId:gid });
    });
  });
  Object.values(plan).forEach(list=>list.sort((a,b)=>a.due.localeCompare(b.due)||a.name.localeCompare(b.name)));
  pending.sort((a,b)=>a.due.localeCompare(b.due)||a.name.localeCompare(b.name));
  return { P, plan, skipped, pending };
}
/* Pagos ya hechos, ligados a su fecha de pago: abonos (debtPayments) y gastos de pagos fijos (expenses) con "occ". */
function paidOccs(){
  const m={};
  const add=(occ,amt,date,col,doc)=>{ const x=m[occ]||(m[occ]={ amount:0, date:'', col, doc, docs:[] }); x.amount=cents(x.amount+amt); if(date>=x.date){ x.date=date; x.col=col; x.doc=doc; } x.docs.push([col,doc]); };
  Object.entries(S.pays).forEach(([pid,p])=>{ if(p.occ) add(p.occ, Number(p.amount)||0, p.date||'', 'debtPayments', pid); });
  Object.entries(S.exps).forEach(([eid,e])=>{ if(e.occ) add(e.occ, Number(e.amount)||0, e.date||'', 'expenses', eid); });
  Object.entries(S.gmoves||{}).forEach(([mid,g])=>{ if(g.occ) add(g.occ, Number(g.amount)||0, g.date||'', 'goalMoves', mid); });
  Object.entries(S.sep).forEach(([sid,r])=>{ if(r.paidExt && r.occ) m[r.occ]={ amount:0, date:r.date||'', col:'sepDone', doc:sid, ext:true }; });
  return m;
}
function sepTotals(list){
  const s=a=>cents(a.reduce((t,i)=>t+i.share,0));
  const debt=s(list.filter(i=>i.grp==='debt')), fixed=s(list.filter(i=>i.grp==='fixed'));
  return { debt, fixed, oblig:cents(debt+fixed), extra:s(list.filter(i=>i.grp==='extra')), save:s(list.filter(i=>i.grp==='save')), done:cents(list.reduce((t,i)=>t+(i.rec?Number(i.rec.amount)||0:0),0)) };
}
function incomeFor(k){ return salaryFor(k)+sum(extrasIn(k)); }
function whenTxt(dueIso){ const n=days(today(),parseDate(dueIso)); return n===0?'hoy':n===1?'mañana':n<0?'hace '+(-n)+' días':'en '+n+' días'; }

let popKey=null;
const sOpen={ debt:true, fixed:true, save:true, extra:false };
let sNextP=null;
function payStateHtml(it, ix, canPay, attr){
  if(it.paid) return '<button type="button" class="paid" data-'+attr+'="'+ix+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'+(it.paid.ext?'Pagado':(it.grp==='save'?'Guardado el ':'Pagado el ')+fmtLong(parseDate(it.paid.date))+(Math.abs(it.paid.amount-it.amount)>0.5?' · '+money(it.paid.amount):''))+'</button>';
  if(!canPay) return '';
  // Lo que vence en esta catorcena lleva botón visible; lo que vence después, un enlace discreto por si pagas antes.
  const soon = it.kind==='extra' || it.kind==='save' || !sNextP || it.due < sNextP;
  return soon ? '<button type="button" class="paybtn" data-'+attr+'="'+ix+'">'+(it.grp==='fixed'?'Registrar pago':it.grp==='save'?'Ya lo guardé':'Registrar abono')+'</button>'
              : '<button type="button" class="linkbtn" data-'+attr+'="'+ix+'">Ya lo pagué</button>';
}
function sepItemHtml(it, ix, isNow, p){
  const isExtra=it.kind==='extra', done=!!it.rec, got=done?Number(it.rec.amount)||0:0;
  const g0=it.kind==='save'?S.goals[it.goalId]:null;

    : (it.kind==='due' && it.of>1 ? 'Parte '+it.part+' de '+it.of+' · ' : '')+fmtLong(parseDate(it.due))+(isNow && !it.paid?' · '+whenTxt(it.due):'')+(it.of>1?' · pago de '+money(it.amount):'');

  const pop = popKey && popKey===sepKey(p,it.id,it.key);

/* Pasar parte de lo que toca separar a la siguiente catorcena (antes de la fecha de pago). */
function mvKey(it){ return 'mv_'+it.payday+'_'+it.id+'_'+it.key; }

async function undoMoveSep(it){

/* Registrar que ya pagaste: un pago fijo se guarda como gasto; una deuda o abono extra, como abono que baja su saldo. */
function occOf(it){ return it.id+'|'+it.key; }
function openPaySep(it){
  if(it.grp==='save'){
    const g=S.goals[it.goalId];
    openModal('<h3>Guardar en '+esc(g.name)+'</h3><p class="sub">Llevas '+money2(goalBal(it.goalId))+' de '+money(g.target)+'. No cuenta como gasto.</p>'+
      '<div class="field"><label for="mAmt">Monto que guardaste</label><input class="amount-in" id="mAmt" type="text" inputmode="decimal" autocomplete="off" value="'+(it.toPay!=null?it.toPay:it.amount)+'"></div>'+
      '<div class="field"><label for="mDate">Fecha</label><input id="mDate" type="date" value="'+iso(today())+'"></div><p class="err" hidden></p>'+
      '<div class="actions"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary grow" id="mSave">Guardar</button></div>', box=>{
      const save=box.querySelector('#mSave'); onEnter(box,save);
      save.onclick=async()=>{
        const v=parseAmt(box.querySelector('#mAmt').value); if(!isFinite(v)||v<=0) return mErr(box,'Escribe cuánto guardaste.');
        const date=box.querySelector('#mDate').value; if(!date) return mErr(box,'Elige la fecha.');
        save.disabled=true;
        const ok=await saved(db.collection('goalMoves').add({ goalId:it.goalId, amount:cents(v), date, ts:Date.now(), occ:occOf(it) }));
        if(!ok){ save.disabled=false; return; }
        closeModal(); toast('+'+money2(v)+' a '+g.name);
      };
    });
    return;
  }
  const isFixed=it.grp==='fixed', debtId=isFixed?null:it.id, fid=isFixed?it.id.slice(2):null;

      '<div class="actions"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary grow" id="pSave">Guardar pago</button></div>', box=>{

function donutHtml(parts, base, centerVal, centerLbl){
  const R=60, C=2*Math.PI*R; let off=0;
  const arcs=parts.filter(x=>x.v>0).map(x=>{
    const len=Math.max(0, x.v/base*C), gap=len>6?3:0;
    const a='<circle class="seg-arc" cx="74" cy="74" r="'+R+'" style="stroke:'+x.c+'" data-da="'+(len-gap).toFixed(1)+' '+(C-len+gap).toFixed(1)+'" data-do="'+(-off).toFixed(1)+'" stroke-dasharray="0 '+C.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"></circle>';
    off+=len; return a;
  }).join('');
  return '<div class="donut"><svg viewBox="0 0 148 148" width="100%" height="100%" aria-hidden="true"><circle cx="74" cy="74" r="'+R+'" style="stroke:var(--surface-2)"></circle>'+arcs+'</svg>'+
    '<div class="mid"><b id="bigSep">'+centerVal+'</b><span>'+centerLbl+'</span></div></div>';
}
function growDonut(root, anim){
  root.querySelectorAll('.seg-arc').forEach(a=>{
    const go=()=>{ a.setAttribute('stroke-dasharray', a.dataset.da); };
    if(anim){ requestAnimationFrame(()=>requestAnimationFrame(go)); } else { a.style.transition='none'; go(); requestAnimationFrame(()=>{ a.style.transition=''; }); }
  });
}

  if(f.freq==='interval'){ const nx=dueList(f, today(), addDays(today(),60))[0]; return 'Cada 4 semanas'+(nx?' · siguiente '+fmtLong(nx):''); }

    save.onclick=async()=>{

      const amt=parseAmt(box.querySelector('#mAmt').value); if(!isFinite(amt)||amt<=0) return mErr(box,'Escribe el monto de cada pago.');
      const data={ name, amount:cents(amt), freq, day1:null, day2:null, next:null, every:null };
      if(freq==='monthly'||freq==='biweekly'){
        const a1=Number(box.querySelector('#mDay1').value); if(!dayOk(a1)) return mErr(box,'Escribe el día de pago (1 a 31).');
        data.day1=a1;
        if(freq==='biweekly'){ const a2=Number(box.querySelector('#mDay2').value); if(!dayOk(a2)||a2===a1) return mErr(box,'Escribe los dos días de pago, por ejemplo 15 y 30.'); data.day1=Math.min(a1,a2); data.day2=Math.max(a1,a2); }
      } else if(freq==='interval'){
        const nx=box.querySelector('#mNext').value; if(!nx) return mErr(box,'Elige la fecha del próximo pago.'); data.next=nx; data.every=28;
      }
      save.disabled=true; save.textContent='Guardando…';
      const ok=await saved(f ? db.collection('fixed').doc(fid).update(data) : db.collection('fixed').add(Object.assign({ createdTs:Date.now() }, data)));
      if(!ok){ save.disabled=false; save.textContent=f?'Guardar cambios':'Agregar gasto fijo'; return; }
      closeModal(); toast(f?'Cambios guardados':name+' agregado a tus gastos fijos');
    };
    const del=box.querySelector('#mDel');
    if(del) del.onclick=async()=>{
      if(!await askConfirm({ title:'¿Eliminar '+esc(f.name)+'?', msg:'Deja de separarse en tus catorcenas. Los gastos que ya registraste de este pago se quedan.', detail:'<b>'+money2(f.amount)+'</b>', ok:'Sí, eliminar' })) return;
      del.disabled=true;
      const ok=await saved(db.collection('fixed').doc(fid).delete());
      if(!ok){ del.disabled=false; return; }
      closeModal(); toast(f.name+' eliminado');
    };
  });
}

function openSepItem(it, p){
  const keyNow=sepKey(p,it.id,it.key), keyPrev=sepKey('0000-00-00',it.id,it.key);
  const prev=S.sep[keyPrev], now=S.sep[keyNow];
  const isExtra=it.kind==='extra';
  openModal('<h3>'+esc(it.name)+'</h3><p class="sub">'+(isExtra?'Abono extra voluntario de '+money(it.amount):'Pago de '+money2(it.amount)+' el '+fmtLong(parseDate(it.due)))+'. Para esta catorcena toca separar '+money2(it.share)+'.</p>'+
    '<div class="field"><label for="mNow">Separé de este pago</label><input class="amount-in" id="mNow" type="text" inputmode="decimal" autocomplete="off" placeholder="'+it.share+'" value="'+(now?Number(now.amount):'')+'"></div>'+
    (isExtra?'':'<div class="optional"><label for="mPrev">Ya tenía separado de antes para este pago (opcional)</label><input id="mPrev" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(prev?Number(prev.amount):'')+'"><p class="hint">Lo que apartaste antes de usar esta sección. Se descuenta de lo que falta separar.</p></div>')+
    '<p class="note">Si separas menos, lo que falta se pasa a las siguientes catorcenas antes de la fecha de pago. Deja vacío para quitar la marca.</p><p class="err" hidden></p>'+
    '<div class="actions"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary grow" id="mSave">Guardar</button></div>', box=>{
    const save=box.querySelector('#mSave'); onEnter(box,save);
    save.onclick=async()=>{
      const read=sel=>{ const el=box.querySelector(sel); if(!el) return null; const raw=el.value.trim(); if(raw==='') return 0; const v=parseAmt(raw); return isFinite(v)&&v>=0 ? cents(v) : NaN; };
      const vNow=read('#mNow'), vPrev=read('#mPrev');
      if(Number.isNaN(vNow) || Number.isNaN(vPrev)) return mErr(box,'Revisa las cantidades, por ejemplo 750 o 750.50.');
      save.disabled=true; save.textContent='Guardando…';
      const col=db.collection('sepDone'), ops=[];
      if(vNow>0) ops.push(col.doc(keyNow).set({ payday:p, debtId:it.id, due:it.key, amount:vNow, ts:Date.now() })); else if(now) ops.push(col.doc(keyNow).delete());
      if(vPrev!=null){ if(vPrev>0) ops.push(col.doc(keyPrev).set({ payday:'0000-00-00', debtId:it.id, due:it.key, amount:vPrev, ts:Date.now() })); else if(prev) ops.push(col.doc(keyPrev).delete()); }
      const ok=await saved(Promise.all(ops));
      if(!ok){ save.disabled=false; save.textContent='Guardar'; return; }
      closeModal(); toast('Guardado');
    };
  });
}

/* ---------- Selector de fecha propio ----------
   El calendario nativo lo dibuja cada celular a su manera. Cada <input type="date"> se cambia por un botón
   con el estilo de la app; el input queda oculto guardando el valor (AAAA-MM-DD) y recibe los eventos
   'input' y 'change', así el resto del código no cambia. */
const DOW=['L','M','M','J','V','S','D'];
let dpOpen=null;
function dpLabel(v){
  if(!v) return 'Elegir fecha';
  const d=parseDate(v), t=today(), n=days(t,d);
  const base=fmtLong(d)+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'');
  return n===0?'Hoy · '+base : n===-1?'Ayer · '+base : n===1?'Mañana · '+base : base;
}
function enhanceDate(inp){
  if(inp.dataset.dp) return; inp.dataset.dp='1';
  const v=inp.value; inp.type='hidden'; inp.value=v;
  const btn=document.createElement('button'); btn.type='button'; btn.className='datebtn';
  if(inp.id){ btn.id=inp.id+'Btn'; const lab=document.querySelector('label[for="'+inp.id+'"]'); if(lab) lab.htmlFor=btn.id; }
  btn.innerHTML='<span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const paint=()=>{ btn.firstChild.textContent=dpLabel(inp.value); btn.setAttribute('aria-label','Fecha: '+dpLabel(inp.value)); };
  paint(); inp._dpPaint=paint;
  inp.after(btn);
  btn.onclick=e=>{ e.stopPropagation(); if(dpOpen && dpOpen.btn===btn){ closePicker(); return; } openPicker(inp, btn); };
}
function closePicker(){ if(!dpOpen) return false; dpOpen.el.remove(); const b=dpOpen.btn; dpOpen=null; try{ b.focus(); }catch(e){} return true; }
function openPicker(inp, btn){
  closePicker();
  const sel=inp.value?parseDate(inp.value):today();
  let vy=sel.getFullYear(), vm=sel.getMonth();
  const el=document.createElement('div'); el.className='dpop'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Elegir fecha');
  const set=v=>{ inp.value=v; inp._dpPaint(); inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); closePicker(); };
  const draw=()=>{
    const first=new Date(vy,vm,1), lead=(first.getDay()+6)%7, nd=lastDay(vy,vm), t=iso(today());
    let cells=''; for(let i=0;i<lead;i++) cells+='<span></span>';
    for(let d=1; d<=nd; d++){ const v=iso(new Date(vy,vm,d));
      cells+='<button type="button" data-d="'+v+'" class="'+(v===inp.value?'sel ':'')+(v===t?'today':'')+'" aria-label="'+fmtLong(new Date(vy,vm,d))+'"'+(v===inp.value?' aria-pressed="true"':'')+'>'+d+'</button>'; }
    el.innerHTML='<div class="dp-h"><button type="button" data-m="-1" aria-label="Mes anterior">‹</button><b>'+MESL[vm]+' '+vy+'</b><button type="button" data-m="1" aria-label="Mes siguiente">›</button></div>'+
      '<div class="dp-w">'+DOW.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="dp-g">'+cells+'</div>'+
      '<div class="dp-f"><button type="button" data-q="0">Hoy</button><button type="button" data-q="-1">Ayer</button><button type="button" class="dp-x" data-close>Cerrar</button></div>';
    el.querySelectorAll('[data-m]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); vm+=Number(b.dataset.m); if(vm<0){vm=11;vy--;} if(vm>11){vm=0;vy++;} draw(); });
    el.querySelectorAll('[data-d]').forEach(b=> b.onclick=()=> set(b.dataset.d));
    el.querySelectorAll('[data-q]').forEach(b=> b.onclick=()=> set(iso(addDays(today(),Number(b.dataset.q)))));
    el.querySelector('[data-close]').onclick=()=> closePicker();
  };
  draw();
  document.body.appendChild(el);
  dpOpen={el,btn,inp};
  // Debajo del botón; si no cabe, arriba. En celular, centrado.
  const r=btn.getBoundingClientRect(), W=el.offsetWidth, H=el.offsetHeight, vw=innerWidth, vh=innerHeight;
  let left=Math.min(Math.max(12, r.left), vw-W-12); if(vw<600) left=(vw-W)/2;
  let top=r.bottom+8; if(top+H>vh-12) top=Math.max(12, r.top-H-8);
  el.style.left=left+'px'; el.style.top=top+'px';
  const cur=el.querySelector('.sel')||el.querySelector('.today'); if(cur) try{ cur.focus({preventScroll:true}); }catch(e){}
}
document.addEventListener('click',e=>{ if(dpOpen && !dpOpen.el.contains(e.target) && e.target!==dpOpen.btn && !dpOpen.btn.contains(e.target)) closePicker(); }, true);
window.addEventListener('resize',()=>closePicker());
document.addEventListener('scroll',e=>{ if(dpOpen && !dpOpen.el.contains(e.target)) closePicker(); }, true);
new MutationObserver(()=>{ document.querySelectorAll('input[type="date"]:not([data-dp])').forEach(enhanceDate); }).observe(document.body,{childList:true,subtree:true});

/* ---------- Bola de nieve ----------
   Cuando una deuda se termina (o una meta de ahorro se cumple), lo que le dabas se recomienda pasarlo:
   primero a tu ahorro si no ha llegado a su meta; si no, a la deuda más pequeña.
   Claves: 'd:<id>' para deudas y 'g:<id>' para metas. La deuda que recibe guarda snows:[{amount,from,src,srcName}];
   la meta que recibe guarda feeds:[...]. La fuente queda con snowDone/snowTo (o snowSkip si dijiste "ahora no"). */
let snowSel=null; // { src, target, amt }
let snowOpen=false; try{ snowOpen=localStorage.getItem('cc2-snowopen')==='1'; }catch(e){}
function debtLabel(id){ const d=S.debts[id]; if(!d) return ''; const dup=Object.values(S.debts).filter(x=>String(x.name).toLowerCase()===String(d.name).toLowerCase()).length>1; return d.name+(dup?' ('+(d.kind==='card'?'tarjeta':'préstamo')+')':''); }
function snowAt(d,p){ return (d.snows||[]).reduce((s,x)=> s+(x.from<=p ? Number(x.amount)||0 : 0), 0); }
function snowSrcNames(d,p){ return (d.snows||[]).filter(x=>x.from<=p).map(x=>x.srcName).filter(Boolean).join(' y '); }
function liqDates(){
  const {P,plan}=computeSep(), m={};
  P.forEach(p=> (plan[p]||[]).forEach(i=>{ if(i.liq && !m[i.id]) m[i.id]=i.due; }));
  return m;
}
function freedPerCat(id){
  const d=S.debts[id], pi=payInfo(d);
  const last=(d.snows||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  return Math.round(pi.monthly*12/26 + (Number(d.extra)||0) + last);
}
function simulateSnow(target, amt, from){
  const d=S.debts[target], keep=d;
  S.debts[target]=Object.assign({}, d, { snows:(d.snows||[]).concat([{ amount:amt, from, src:'sim', srcName:'' }]) });
  let r; try{ r=liqDates()[target]||null; } finally { S.debts[target]=keep; }
  return r;
}
function snowSourceReset(src){
  if(!src) return [];
  if(String(src).startsWith('g:')){ const gid=src.slice(2); return S.goals[gid] ? [db.collection('goals').doc(gid).update({ snowDone:false, snowTo:null })] : []; }
  const id=String(src).replace(/^d:/,''); return S.debts[id] ? [db.collection('debts').doc(id).update({ snowDone:false, snowTo:null })] : [];
}
function snowCandidate(){
  if(!S.anchor) return null;
  const liq=liqDates(), lim=iso(addDays(today(),45)), srcs=[];
  Object.entries(S.debts).forEach(([id,d])=>{ if(d.freq && !d.snowDone && !d.snowSkip && (balanceOf(id)<=0.5 || (liq[id] && liq[id]<=lim))) srcs.push({ key:'d:'+id, name:d.name, when:liq[id]||iso(today()), amount:freedPerCat(id), kind:'debt', d }); });
  goalList().forEach(([gid,g])=>{
    const per=goalPerCatAt(g,'9999'); if(!(per>0) || g.snowDone || g.snowSkip) return;
    const r=goalProjection(gid).reach; if(r && r<=lim) srcs.push({ key:'g:'+gid, name:g.name, when:r, amount:per, kind:'goal', g });
  });
  if(!srcs.length) return null;
  srcs.sort((a,b)=>a.when.localeCompare(b.when));
  const c=srcs[0]; c.from=iso(periodStart(periodOf(parseDate(c.when))+1));
  const targets=[];
  if(c.kind==='debt') goalList().forEach(([gid,g])=>{ if(goalBal(gid)<(Number(g.target)||0)-0.5){ const r=goalProjection(gid).reach; if(!r || r>=c.from) targets.push({ key:'g:'+gid, name:g.name, kind:'goal', bal:goalBal(gid), target:Number(g.target)||0 }); } });
  const exclude = c.kind==='debt' ? c.key.slice(2) : null;
  Object.entries(S.debts).filter(([t,x])=> t!==exclude && x.freq && balanceOf(t)>0.5 && !(liq[t] && liq[t]<c.from))
    .sort((a,b)=>balanceOf(a[0])-balanceOf(b[0])).slice(0,3).forEach(([t])=> targets.push({ key:'d:'+t, name:debtLabel(t), kind:'debt', bal:balanceOf(t) }));
  if(!targets.length) return null;
  c.targets=targets; c.liq=liq;
  return c;
}
function snowCardHtml(){
  const c=snowCandidate(); if(!c) return '';
  if(!snowSel || snowSel.src!==c.key){ snowSel={ src:c.key, target:c.targets[0].key, amt:c.amount }; }
  if(!c.targets.some(t=>t.key===snowSel.target)) snowSel.target=c.targets[0].key;
  const fmtWhen=v=> v ? fmtLong(parseDate(v)) : 'en más de 6 meses';
  const firstDebt=c.targets.find(t=>t.kind==='debt');
  const opts=c.targets.map(t=>{
    let line;
    if(t.kind==='goal'){
      const gid=t.key.slice(2), before=goalProjection(gid).reach, after=goalProjection(gid,{ amount:snowSel.amt, from:c.from }).reach;
      line='Llevas '+money(t.bal)+' de '+money(t.target)+' · llegarías a tu meta el '+fmtWhen(after)+(before!==after?' (sin esto: '+fmtWhen(before)+')':'');
    } else {
      const id=t.key.slice(2), before=c.liq[id]||null, after=simulateSnow(id, snowSel.amt, c.from);
      line='Debes '+money2(t.bal)+' · se liquidaría '+fmtWhen(after)+(before!==after?' (sin esto: '+fmtWhen(before)+')':'');
    }
    const badge= t.kind==='goal' ? ' <span class="badge">Recomendada · primero tu fondo</span>' : (t===firstDebt ? ' <span class="badge sb">La deuda más pequeña</span>' : '');
    return '<label class="sn-opt'+(snowSel.target===t.key?' on':'')+'"><input type="radio" name="snowT" value="'+t.key+'"'+(snowSel.target===t.key?' checked':'')+'>'+
      '<span class="sn-o"><b>'+(t.kind==='goal'?'Ahorro: ':'')+esc(t.name)+'</b>'+badge+'<span class="s">'+line+'</span></span></label>';
  }).join('');
  const head = c.kind==='debt'
    ? esc(c.name)+(balanceOf(c.key.slice(2))<=0.5?' ya está liquidada.':' se termina el '+fmtLong(parseDate(c.when))+'.')
    : 'Tu '+esc(c.name)+' llega a su meta el '+fmtLong(parseDate(c.when))+'.';
  const tgt=c.targets.find(t=>t.key===snowSel.target);
  return '<section class="snow'+(snowOpen?' open':'')+'" aria-label="Bola de nieve">'+
    '<button type="button" class="sn-h" id="snTog" aria-expanded="'+snowOpen+'"><span class="sn-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4.9 7l14.2 10M19.1 7L4.9 17"/></svg></span><div><b>Bola de nieve</b>'+
      '<p>'+head+' Desde tu pago del '+fmtLong(parseDate(c.from))+' te quedan libres unos <b>'+money(c.amount)+' por catorcena</b>.</p></div>'+
      '<svg class="sn-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '<div class="sn-body"><div class="sn-in">'+
    '<p class="sn-q">¿A dónde los mandamos?</p><div class="sn-opts">'+opts+'</div>'+
    '<div class="sn-row"><label for="snAmt">Monto por catorcena</label><input id="snAmt" type="text" inputmode="decimal" value="'+snowSel.amt+'"></div>'+
    '<p class="note" style="margin:8px 0 0">Es una recomendación: si la aplicas, Separar te pedirá ese monto desde el '+fmt(parseDate(c.from))+'. Lo puedes quitar después.</p>'+
    '<div class="actions"><button type="button" class="btn-ghost" id="snSkip">No sugerir para '+esc(c.name)+'</button><button type="button" class="btn-primary grow" id="snApply">Mandarlo a '+esc(tgt?tgt.name:'')+'</button></div>'+
  '</div></div></section>';
}
function wireSnow(m){
  const box=m.querySelector('.snow'); if(!box) return;
  const c=snowCandidate(); if(!c) return;
  box.querySelector('#snTog').onclick=()=>{ snowOpen=!snowOpen; try{ localStorage.setItem('cc2-snowopen',snowOpen?'1':'0'); }catch(e){} box.classList.toggle('open',snowOpen); box.querySelector('#snTog').setAttribute('aria-expanded',snowOpen); };
  box.querySelectorAll('input[name="snowT"]').forEach(r=> r.onchange=()=>{ snowSel.target=r.value; renderDeudas(); });
  const amt=box.querySelector('#snAmt'); let t=null;
  amt.addEventListener('input',()=>{ const v=parseAmt(amt.value); if(isFinite(v)&&v>0){ clearTimeout(t); t=setTimeout(()=>{ snowSel.amt=Math.round(v*100)/100; const pos=amt.selectionStart; renderDeudas(); const a2=document.getElementById('snAmt'); if(a2){ a2.focus(); try{ a2.setSelectionRange(pos,pos); }catch(e){} } },500); } });
  const srcRef= c.kind==='debt' ? db.collection('debts').doc(c.key.slice(2)) : db.collection('goals').doc(c.key.slice(2));
  box.querySelector('#snSkip').onclick=async e=>{
    if(!await askConfirm({ title:'¿Dejar de sugerir para '+esc(c.name)+'?', msg:'Ya no verás esta recomendación de bola de nieve. Si solo quieres esconderla, toca el título para cerrarla.', ok:'Sí, no sugerir', warn:false })) return;
    const ok=await saved(srcRef.update({ snowSkip:true })); if(ok) toast('Listo, no te lo vuelvo a sugerir para '+c.name); };
  box.querySelector('#snApply').onclick=async e=>{
    const v=parseAmt(amt.value); if(!isFinite(v)||v<=0) return toast('Escribe cuánto mandar por catorcena.',true);
    const btn=e.currentTarget; btn.disabled=true;
    const entry={ amount:Math.round(v*100)/100, from:c.from, src:c.key, srcName:c.name };
    const tk=snowSel.target, ops=[srcRef.update({ snowDone:true, snowTo:tk })]; let tname;
    if(tk.startsWith('g:')){ const g=S.goals[tk.slice(2)]; tname=g.name; ops.push(db.collection('goals').doc(tk.slice(2)).update({ feeds:(g.feeds||[]).concat([entry]) })); }
    else { const d=S.debts[tk.slice(2)]; tname=debtLabel(tk.slice(2)); ops.push(db.collection('debts').doc(tk.slice(2)).update({ snows:(d.snows||[]).concat([entry]) })); }
    const ok=await saved(Promise.all(ops)); if(!ok){ btn.disabled=false; return; }
    animNext=true; toast(money(v)+' por catorcena irán a '+tname+' desde el '+fmt(parseDate(c.from)));
  };
}
async function removeSnow(targetId, ix){
  const tg=S.debts[targetId], sn=(tg.snows||[])[ix]; if(!sn) return;
  const ops=[db.collection('debts').doc(targetId).update({ snows:tg.snows.filter((_,i)=>i!==ix) }), ...snowSourceReset(sn.src)];
  const ok=await saved(Promise.all(ops)); if(ok){ closeModal(); toast('Bola de nieve quitada de '+tg.name); }
}

/* ---------- Ahorro ----------
   Una meta (ej. Fondo de emergencia $25,000) con lo que ya tienes, un aporte por catorcena desde una fecha
   (propio o que llega de una deuda terminada: feeds) y dinero extra esperado (aportes, ej. aguinaldo).
   Lo que guardas se registra en goalMoves; nunca cuenta como gasto. */
function goalList(){ return Object.entries(S.goals).sort((a,b)=>(a[1].createdTs||0)-(b[1].createdTs||0)); }
function goalBal(gid){
  const g=S.goals[gid]; if(!g) return 0; let b=Number(g.base)||0;
  Object.values(S.gmoves).forEach(m=>{ if(m.goalId===gid && (m.ts||0)>(Number(g.baseTs)||0)) b+=Number(m.amount)||0; });
  return cents(b);
}
function goalPerCatAt(g,p){
  let a=0; if(Number(g.perCat)>0 && g.from && g.from<=p) a+=Number(g.perCat);
  (g.feeds||[]).forEach(f=>{ if(f.from<=p) a+=Number(f.amount)||0; });
  return a;
}
function goalProjection(gid, extraFeed){
  const g0=S.goals[gid]; if(!g0) return { byP:{}, reach:null };
  const g= extraFeed ? Object.assign({}, g0, { feeds:(g0.feeds||[]).concat([extraFeed]) }) : g0;
  const target=Number(g.target)||0; let bal=goalBal(gid);
  const K0=sepK0(), P=[]; for(let i=0;i<26;i++) P.push(iso(periodStart(K0+i)));
  const pm=paidOccs(), t=iso(today()), ev=P.map(p=>({ t:'p', date:p }));
  (g.aportes||[]).forEach(a=>{ if(!a.done && a.date>=t) ev.push({ t:'a', date:a.date, amount:Number(a.amount)||0 }); });
  ev.sort((a,b)=>a.date.localeCompare(b.date)||(a.t==='a'?-1:1));
  const byP={}; let reach= target>0 && bal>=target-0.5 ? t : null;
  ev.forEach(e=>{
    if(e.t==='p'){
      const pd=pm['g-'+gid+'|v'+e.date];
      if(pd){ byP[e.date]={ amount:pd.amount, paid:true }; }
      else if(!reach){ const a=cents(Math.min(goalPerCatAt(g,e.date), target-bal)); if(a>0.5){ byP[e.date]={ amount:a }; bal=cents(bal+a); } }
    } else if(!reach){ bal=cents(bal+e.amount); }
    if(!reach && target>0 && bal>=target-0.5) reach=e.date;
  });
  return { byP, reach };
}
function goalCardHtml(){

/* ---------- Por revisar (compras que llegan solas, p. ej. de Apple Pay) ----------
   Cada documento de inbox trae texto tal cual lo manda el atajo: amount ("$1,250.50"), merchant, card, date. */
function inboxAmt(raw){
  let t=String(raw||'').replace(/[^\d.,-]/g,''); if(!t) return NaN;
  if(t.includes(',') && t.includes('.')) t= t.lastIndexOf(',')>t.lastIndexOf('.') ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
  else if(t.includes(',')) t= /,\d{1,2}$/.test(t) ? t.replace(',','.') : t.replace(/,/g,'');
  return Math.abs(Number(t));
}
function inboxDate(raw){
  const t=String(raw||'');
  if(/\d{4}-\d{2}-\d{2}T\d/.test(t)){ const d=new Date(t); if(!isNaN(d)) return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate())); }
  const m=t.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const d=new Date(t); return isNaN(d) ? iso(today()) : iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
const cardKey=raw=> String(raw||'').trim().toLowerCase().replace(/[^a-z0-9áéíóúñ ]/g,'').slice(0,60) || 'tarjeta';
// Cómo pagaste con esa tarjeta de Wallet: lo que elegiste la última vez; si nunca, se adivina por el nombre.
function inboxPay(raw){
  const m=(S.cardmap||{})[cardKey(raw)];
  if(m && (m.method!=='credit' || S.debts[m.cardId])) return { method:m.method, cardId:m.method==='credit'?m.cardId:null, learned:true };
  const t=String(raw||'').toLowerCase();
  if(/d[eé]bito|n[oó]mina|libret[oó]n/.test(t)) return { method:'debit', cardId:null };
  const cid=inboxCard(raw); return cid ? { method:'credit', cardId:cid } : { method:'debit', cardId:null };
}
function inboxCard(raw){
  const t=String(raw||'').toLowerCase(); if(!t) return null;
  const hit=debtsOf('card').find(([,d])=> t.includes(String(d.name).toLowerCase()));
  return hit ? hit[0] : null;
}
function inboxList(){ return Object.entries(S.inbox||{}).sort((a,b)=>String(b[1].date||'').localeCompare(String(a[1].date||''))); }
function inboxHtml(){
  const L=inboxList(); if(!L.length) return '';
  return '<section class="inbox" aria-label="Compras por revisar"><div class="ib-h"><b>Por revisar</b><span>'+L.length+' compra'+(L.length===1?'':'s')+' de Apple Pay</span></div>'+
    L.map(([id,x])=>{ const a=inboxAmt(x.amount), pay=inboxPay(x.card), cid=pay.cardId;
      return '<div class="ib-row"><span class="grow"><span class="t">'+(isFinite(a)?money2(a):esc(x.amount||'?'))+' · '+esc(x.merchant||'Compra')+'</span>'+
        '<span class="s">'+fmtLong(parseDate(inboxDate(x.date)))+' · '+esc(x.card||'Tarjeta')+(cid?' · crédito '+esc(debtLabel(cid)):pay.learned?' · débito':'')+'</span></span>'+
        '<button type="button" class="ib-x" data-ibx="'+id+'" aria-label="Descartar">Descartar</button><button type="button" class="btn-primary ib-ok" data-ibok="'+id+'">Revisar</button></div>';
    }).join('')+'</section>';
}

function connectFirebase(){
  return new Promise(resolve=>{
    if(!window.firebase){ resolve(null); return; }

      main().innerHTML='<section class="welcome"><h2>Falta configurar Firebase</h2><p>No encontré tu configuración. Revisa que subiste <b>firebase-config.js</b> junto a index.html y que no quedó ningún <code>PEGA_AQUI</code>.</p></section>'; setSync('off'); resolve('wait'); return;
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fsdb=firebase.firestore(); try{ fsdb.settings({ ignoreUndefinedProperties:true, merge:true }); }catch(e){}
    let done=false;
    firebase.auth().onAuthStateChanged(u=>{
      if(u){ if(done){ if(fbUser && fbUser.uid!==u.uid) location.reload(); return; } done=true; fbUser=u; document.body.classList.remove('nologin'); setSync('wait'); resolve(makeDb(u.uid)); }

async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ return toast('Ese archivo no es un respaldo válido.',true); }
  const cols=data && data.collections; if(!cols || data.app!=='catorcenas-claras') return toast('Ese archivo no es un respaldo de Catorcenas Claras.',true);
  const n=Object.values(cols).reduce((s,c)=>s+Object.keys(c||{}).length,0);
  const has=Object.keys(S.debts).length+Object.keys(S.exps).length+Object.keys(S.salaries).length>0;
  if(!await askConfirm({ title:'¿Importar '+n+' registros?', msg: has ? 'Se agregan a lo que ya tienes. Si un registro ya existe con el mismo id, se reemplaza por el del respaldo.' : 'Se cargan tus deudas, gastos, pagos fijos, ahorro y lo que ya separaste.', ok:'Sí, importar', warn:has })) return;
  const writes=[]; Object.entries(cols).forEach(([c,docs])=> Object.entries(docs||{}).forEach(([id,d])=> writes.push([c,id,d])));
  toast('Importando…');
  try{
    for(let i=0;i<writes.length;i+=400){
      const b=db.batch(); writes.slice(i,i+400).forEach(([c,id,d])=> b.set(db.root.collection(c).doc(id), d)); await b.commit();
    }
    closeModal(); toast('Listo: '+n+' registros importados');
  }catch(e){ toast('No se pudo importar: '+(e.code||e.message||'error'),true); }
}
function pickImport(){

  inp.onchange=()=>{ if(inp.files && inp.files[0]) importBackup(inp.files[0]); };

}
function randKey(){ const a=new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a,b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join(''); }
function inboxUrl(){ return 'https://firestore.googleapis.com/v1/projects/'+FIREBASE_CONFIG.projectId+'/databases/(default)/documents/users/'+fbUser.uid+'/inbox?key='+FIREBASE_CONFIG.apiKey; }
function inboxTemplate(key){ return '{"fields":{"amount":{"stringValue":"MONTO"},"merchant":{"stringValue":"COMERCIO"},"card":{"stringValue":"TARJETA"},"date":{"stringValue":"FECHA"},"key":{"stringValue":"'+key+'"}}}'; }
async function copyText(t,label){ try{ await navigator.clipboard.writeText(t); toast(label+' copiado'); }catch(e){ prompt('Copia esto:',t); } }
async function openApplePay(){
  const ref=db.collection('private').doc('inbox');
  let key=null; try{ const d=await ref.get(); key=d.exists ? d.data().key : null; }catch(e){}
  if(!key){ key=randKey(); const ok=await saved(ref.set({ key, created:Date.now() })); if(!ok) return; }
  openModal('<h3>Compras automáticas con Apple Pay</h3><p class="sub">Cada vez que pagues con tu tarjeta en Wallet, la compra llega sola a <b>Gastos › Por revisar</b>. Tú solo eliges la categoría.</p>'+
    '<div class="acct-btns"><button type="button" id="apUrl">1. Copiar la dirección<small>Va en la acción "Obtener contenido de URL" del atajo.</small></button>'+
    '<button type="button" id="apTpl">2. Copiar la plantilla<small>Va en la acción "Texto". Luego cambias MONTO, COMERCIO, TARJETA y FECHA por las variables.</small></button>'+
    '<button type="button" id="apTest">Probar envío<small>Manda una compra de prueba de $1.00 para ver que todo funcione.</small></button>'+
    '<button type="button" id="apNew">Cambiar clave<small>Si crees que alguien vio tu clave. Tendrás que volver a copiar la plantilla en el atajo.</small></button></div>'+
    '<p class="note">La guía <b>APPLE-PAY.md</b> tiene los pasos con detalle.</p>', box=>{
    box.querySelector('#apUrl').onclick=()=>copyText(inboxUrl(),'Dirección');
    box.querySelector('#apTpl').onclick=()=>copyText(inboxTemplate(key),'Plantilla');
    box.querySelector('#apTest').onclick=async e=>{
      const b=e.currentTarget; b.disabled=true;
      const body=inboxTemplate(key).replace('MONTO','$1.00').replace('COMERCIO','Prueba de Apple Pay').replace('TARJETA','Prueba').replace('FECHA',new Date().toISOString());
      try{ const r=await fetch(inboxUrl(),{ method:'POST', headers:{'Content-Type':'application/json'}, body });
        if(r.ok){ closeModal(); toast('¡Funciona! Revisa Gastos › Por revisar'); }
        else { const t=await r.text(); toast(r.status===403?'Firebase rechazó la prueba: revisa que publicaste las reglas nuevas (firestore.rules).':'Error '+r.status+': '+t.slice(0,120),true); }
      }catch(err){ toast('No se pudo enviar: '+err.message,true); }
      b.disabled=false;
    };
    box.querySelector('#apNew').onclick=async()=>{
      if(!await askConfirm({ title:'¿Cambiar la clave?', msg:'El atajo que ya tienes dejará de funcionar hasta que pegues la plantilla nueva.', ok:'Sí, cambiar', warn:false })) return;
      const ok=await saved(ref.set({ key:randKey(), created:Date.now() })); if(ok){ closeModal(); toast('Clave cambiada'); openApplePay(); }
    };
  });
}
function openAccount(){
  if(!fbUser) return;
  openModal('<h3>Tu cuenta</h3><p class="sub">Tus datos están en tu propio Firebase y se sincronizan entre tu celular y tu PC.</p>'+
    '<div class="acct-row">'+(fbUser.photoURL?'<img src="'+esc(fbUser.photoURL)+'" alt="" width="36" height="36" style="border-radius:50%" referrerpolicy="no-referrer">':'')+'<span class="who">'+esc(fbUser.displayName||'')+'<small>'+esc(fbUser.email||'')+'</small></span></div>'+
    '<div class="acct-btns"><button type="button" id="aExp">Descargar respaldo<small>Un archivo con todos tus datos. Guárdalo de vez en cuando.</small></button>'+
    '<button type="button" id="aAp">Compras automáticas con Apple Pay<small>Configura el atajo de tu iPhone para que tus compras lleguen solas.</small></button>'+
    '<button type="button" id="aImp">Importar respaldo<small>Carga un archivo de respaldo (por ejemplo, el que te pasé de Claude).</small></button>'+
    '<button type="button" id="aOut">Cerrar sesión<small>Tus datos se quedan en la nube.</small></button></div>', box=>{
    box.querySelector('#aExp').onclick=downloadBackup;
    box.querySelector('#aImp').onclick=pickImport;
    box.querySelector('#aAp').onclick=()=>{ closeModal(); openApplePay(); };
    box.querySelector('#aOut').onclick=async()=>{ if(!await askConfirm({ title:'¿Cerrar sesión?', msg:'Tendrás que volver a entrar con Google. Tus datos no se borran.', ok:'Sí, cerrar sesión', warn:false })) return; closeModal(); firebase.auth().signOut(); };
  });
}
document.getElementById('sync').onclick=openAccount;
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- Conexión ---------- */
async function start(){
  try{ db = await connectFirebase(); }catch(e){ db=null; }
  if(db==='wait'){ db=null; return; }
  if(!db){ setSync('off'); main().innerHTML='<section class="welcome"><h2>Sin conexión</h2><p>No se pudo conectar con tus datos. Revisa tu internet y vuelve a abrir la página.</p></section>'; return; }
  const fail=e=>{ setSync('off'); if(e && e.code==='permission-denied') toast('Firebase no te dejó leer tus datos. Revisa las reglas de seguridad (paso 4 de la guía).',true); };
  db.doc('config/main').onSnapshot(s=>{ const c=s.exists ? (s.data()||{}) : {}; S.anchor = c.anchor||null; S.sepStart = c.sepStart||null; S.loaded.config=true; setSync('ok'); render(); }, fail);
  db.collection('salaries').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.salaries=n; S.loaded.salaries=true; render(); }, fail);
  db.collection('extras').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.extras=n; S.loaded.extras=true; render(); }, fail);
  db.collection('debts').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.debts=n; S.loaded.debts=true; render(); }, fail);
  db.collection('debtPayments').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.pays=n; S.loaded.pays=true; render(); }, fail);
  db.collection('expenses').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.exps=n; S.loaded.exps=true; render(); }, fail);
  db.collection('goals').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.goals=n; S.loaded.goals=true; render(); }, fail);
  db.collection('goalMoves').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.gmoves=n; S.loaded.gmoves=true; render(); }, fail);
  db.collection('fixed').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.fixed=n; S.loaded.fixed=true; render(); }, fail);
  db.collection('sepDone').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.sep=n; S.loaded.sep=true; render(); }, fail);
  db.doc('config/cardmap').onSnapshot(s=>{ S.cardmap= s.exists ? (s.data()||{}) : {}; }, ()=>{});
  db.collection('inbox').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.inbox=n; if(tab==='gastos') render(); }, ()=>{});
  db.collection('expCats').onSnapshot(s=>{ const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.cats=n; S.loaded.cats=true; render(); }, fail);
}
document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click',()=>{ if(tab===b.dataset.tab) return; tab=b.dataset.tab; animNext=true; sheet=null; editing=null; try{ localStorage.setItem('cc2-tab',tab); }catch(e){} render(); const m=main(); m.classList.remove('fade-in'); void m.offsetWidth; m.classList.add('fade-in'); window.scrollTo({top:0}); }));
['fab','fabTop'].forEach(x=>{ const b=document.getElementById(x); if(b) b.onclick=openNewExp; });
render();
start();
</script>
